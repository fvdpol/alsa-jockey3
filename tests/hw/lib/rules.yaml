# Global kernel-message classification rules.
#
# Per-case expectations live in catalog.yaml under `expect_dmesg`; this file
# holds what is true regardless of which case is running.
#
# The important thing this file encodes: "no warnings" is NOT a pass criterion
# for this driver. Capture stall after a rate change is expected on a healthy
# build, and the driver logs it deliberately on every occurrence so that stall
# frequency can be tracked. A rule set that failed on warnings would fail every
# run on a perfectly good driver.

version: 1

# Messages from our driver that are normal anywhere. Counted and reported as
# metrics, never failures.
benign:
  - pattern: 'Playback URB has stalled\.'
    metric: stalls_playback
    why: >
      Logged on every stall regardless of whether recovery follows, so that
      frequency can be tracked. Recovery is what matters, not occurrence.
  - pattern: 'Capture URB has stalled\.'
    metric: stalls_capture
    why: Same as playback -- expected, tracked, not a failure.
  # Split by which direction hw_params() found dead after the change, because
  # "how often did a capture stall need recovery" is the question milestone 13
  # is judged on and the undifferentiated count cannot answer it. The driver
  # already logs the reason -- playback_alive, capture_alive, capture_open --
  # so no driver change is needed to recover it.
  #
  # Stage 3 unified the recovery path: this line now means "hw_params found a
  # stall and is about to try jockey3_recover_urb_stream()", not "a reset is
  # about to happen" -- that function tries a lightweight URB restart first,
  # and only escalates to a reset (logged separately, see restart_escalated
  # below) if the restart alone does not bring the direction back. The metric
  # names keep the "recovery" wording rather than "resets" for the same reason.
  #
  # These must precede the generic rule below: the first matching benign
  # pattern wins, so a broad pattern placed first would swallow both. Total
  # recoveries triggered after a rate change is the sum of the three.
  - pattern: 'Rate change to \d+ Hz left a stream stalled \(playback_alive=0'
    metric: recovery_triggered_playback
    why: >
      Playback died, which always triggers recovery -- it carries MIDI OUT in
      byte 480 of every packet, so it may never be left down.
  - pattern: 'Rate change to \d+ Hz left a stream stalled \(playback_alive=1, capture_alive=0'
    metric: recovery_triggered_capture
    why: >
      Playback survived and capture did not, with a capture stream open. This
      is the milestone 13 fault forcing the heaviest mitigation the driver has,
      and its rate against rate_changes is the number that says whether the
      problem is getting better.
  - pattern: 'Rate change to \d+ Hz left a stream stalled'
    metric: recovery_triggered_full
    why: >
      Any post-rate-change recovery not attributed above -- which should be
      none, so a count here means the driver's message format changed and the
      two rules above have gone stale.
  - pattern: 'waited (\d+) ms for reset completion'
    metric: reset_wait_ms
    capture: 1
    why: >
      The value is the metric. Its distribution is the early-warning signal for
      the rate-change path, more useful than any single verdict.
  - pattern: 'stopped after \d+ consecutive URB errors; deferring recovery'
    metric: urb_error_giveup
    why: >
      Routine on unplug -- all eight in-flight URBs error at once -- so this is
      the normal path into disconnect, not an exotic one.
  - pattern: 'Failed to resubmit (?:playback|capture) URB: -(?:2|19|108)$'
    metric: urb_resubmit_teardown
    why: >
      -ENOENT and -ESHUTDOWN mean the URB was killed while a completion was
      already in flight, which is exactly what jockey3_stop_urbs() does. Every
      one of the 49 seen on the first hardware run landed in the microseconds
      after "deregistering interface driver".
      -ENODEV is the same teardown seen from the other direction: a clean
      VBUS drop (JT-RATE-004's usb-power cutting a hub port, rather than an
      unbind) marks the device NOTATTACHED before the completion handler
      gets to resubmit, and every in-flight URB reports -19 at once rather
      than the -2/-108 an unbind produces. The case's own docstring notes a
      real cable pull degrades through -71 first; that path is not covered
      here and must stay a failure if it appears.
      Deliberately matched by errno rather than by message: a resubmit failure
      with any OTHER error code is not teardown, and must stay a failure.
  - pattern: >-
      Failed to (?:initialize device to change rate|read current hardware
      rate|set rate|start streaming after rate change): -19$
    metric: rate_change_raced_removal
    why: >
      This is not generic teardown noise, it is JT-RATE-004's actual target.
      jockey3_set_rate() is a sequential EP0 handshake -- initialize, read
      rate, set rate, start streaming -- that returns on the first stage to
      fail, so exactly one of these four dev_err lines fires per failed
      attempt, at whichever stage the device happened to vanish under it.
      jockey3_set_rate() checks jockey3_is_disconnected() before starting,
      so reaching any of these with -ENODEV means the device was still
      believed live when the handshake began and went away mid-transfer --
      the exact window the case exists to provoke. Counted rather than
      failed, and counted separately from urb_resubmit_teardown above,
      because how often the race actually lands is the number that matters
      here, and this line is a far more precise signal of that than watching
      aplay's own exit status ever was. The driver_fail entry below still
      fails every other errno, in particular -110 (ETIMEDOUT), which means
      the device is enumerated but has genuinely stopped answering -- a real
      wedge, not a race.
  - pattern: 'Rate change to \d+ failed: -19$'
    why: >
      The jockey3_pcm_hw_params() wrapper around jockey3_set_rate(), logged
      one level up the call stack from and always alongside one of the four
      messages above -- same event, same race, not counted a second time as
      a separate metric here to avoid double-counting it.
  - pattern: 'Firmware 0x[0-9a-f]{2} v\d+\.\d+\.\d+'
    why: >
      The firmware revision, which the runner parses out of the log because
      there is no sysfs attribute for it and adding one would be a change to
      the driver made for tests.

      Global rather than a per-case expectation, because it is not emitted
      once at probe as was long assumed: ploytec_get_firmware() sits inside
      ploytec_initialize_device(), which jockey3_set_rate() also calls, so the
      device re-reports on every rate change -- 63 times in one smoke run.
      Listing it only under JT-PROBE-001 failed every case that changes rate.
  # ------------------------------------------------------------------------
  # The driver's dev_dbg traces.
  #
  # These are silent unless someone turns dynamic debug up, which is a normal
  # thing to do while investigating -- and the moment they did, every case
  # that saw one failed, because an unrecognized message that looks like ours
  # is a failure by default. A run should not turn red because the operator
  # asked the driver to be talkative.
  #
  # Classified as a group rather than one rule per string: there are 25 of
  # them, they are all traces, and this driver reports every actual problem
  # through dev_warn or dev_err. Nothing here indicates a fault; the ones that
  # do are in driver_fail below.
  #
  # A cleaner future fix is to classify on syslog priority -- KERN_DEBUG from
  # our driver is by definition a trace -- which needs dmesg-read to emit raw
  # priorities. lib/kmsg.PREFIX_RE already tolerates the "<7>" they come with.
  - pattern: '(Starting|Stopping) all URBs'
    metric: dbg_urb_lifecycle
  - pattern: 'PCM (open|close|prepare|trigger|hw_params) '
  - pattern: 'Setting (rate|new hardware rate)'
  - pattern: 'Rate (set OK|verified as|changed to|already set to)'
  - pattern: '(Current hardware rate|Hardware rate already at requested value)'
  - pattern: 'USB (suspend, stopping URBs|resume, restoring device|reset resume, restoring device)'
  - pattern: 'Using (32-bit optimized|64-bit optimized|portable) codec'
  - pattern: '(Ploytec initialized successfully|Initialization complete)'
  - pattern: 'Waiting for reset completion'
  - pattern: 'Start Streaming: Status: 0x'
  # A trace, not a fault: the counterpart of the driver_fail "Failed to start
  # URBs ..." rules, for the one case that is expected -- the device was already
  # detached, so there was nothing to start and disconnect is on its way.
  - pattern: 'Could not start URBs after .*: device is gone'
  # ------------------------------------------------------------------------
  - pattern: 'loading out-of-tree module taints kernel'
    metric: taint_out_of_tree
    why: >
      Every locally built module says this. build_module.sh compiles with M=,
      so the result is intree:N where the packaged module was intree:Y -- which
      means this appears from the moment a test build is deployed, and did not
      appear before. Expected, and worth counting only to notice if a run was
      unexpectedly made against a packaged module instead.
  - pattern: 'module verification failed: signature and/or required key missing'
    why: >
      MODULE_SIG_FORCE is deliberately off on the test kernels -- see
      tests/configs/README.md -- because locally built modules would otherwise
      not load at all. The complaint is expected and carries no information.
  - pattern: 'usbcore: (?:registered new|deregistering) interface driver snd-reloop-jockey3'
    metric: module_lifecycle
    why: >
      usbcore's own load/unload announcement. It carries the module name, so it
      reads as ours and would otherwise fail every case that cycles the driver
      -- which is what it did on the first hardware run.
  # jockey3_recover_urb_stream()'s ladder, shared by both directions and by
  # both call sites (hw_params()'s post-rate-change check, prepare()'s
  # liveness check) since Stage 3. Each step is expected on a healthy build
  # and is tracked so the escalation rate is visible; only the final give-up
  # (in driver_fail) is a failure.
  - pattern: 'Capture stream stalled \(opening a capture stream\); restarting URBs to recover'
    metric: capture_recovery_on_open
    why: >
      Deferred recovery arriving where it was designed to: a capture stall left
      by an earlier rate change (idle, so hw_params() did not act on it) is
      picked up at the next capture open.
  - pattern: 'Playback stream stalled \(preparing a playback stream\); restarting URBs to recover'
    metric: playback_recovery_on_prepare
    why: >
      Stage 3's symmetric counterpart to capture_recovery_on_open: a playback
      stall found by .prepare -- rather than by hw_params() immediately after a
      rate change -- now gets the same recovery attempt instead of only a log
      line.
  - pattern: '(?:Playback|Capture) stream stalled \(a rate change\); restarting URBs to recover'
    metric: urb_restart_attempt
    why: >
      The lightweight first step of recovery, before any USB reset, triggered
      directly from hw_params() rather than from a later prepare(). Ratelimited
      by the driver, so a flapping stall can undercount this specific metric --
      read alongside recovery_triggered_playback/capture, which are not.
  - pattern: '(?:Playback|Capture) stream still stalled after URB restart; queuing full USB reset'
    metric: restart_escalated
    why: >
      Escalation from URB restart to a full reset. Expected sometimes; a rising
      proportion of restarts that escalate is the signal worth watching.
  - pattern: 'Playback stream stalled \(the watchdog\); restarting URBs to recover'
    metric: playback_recovery_on_watchdog
    why: >
      The watchdog itself triggering recovery on a mid-stream stall with no PCM
      ioctl re-entry to catch it -- the gap JT-PCM-008-1 (2026-08-23) exposed.
      Recovery is attempted with xrun-reporting enabled; that does not by
      itself mean an xrun was delivered (jockey3_report_xrun() still requires
      the substream to be open and running).
  - pattern: 'Capture stream stalled \(the watchdog\); restarting URBs to recover'
    metric: capture_recovery_on_watchdog
    why: >
      Symmetric counterpart, gated the same way hw_params() already gates its
      own capture recovery: only when a capture stream is open.
  # ------------------------------------------------------------------------
  # The URB liveness watchdog.
  #
  # The watchdog now acts as well as detects: jockey3_watchdog_check() calls
  # jockey3_recover_urb_stream() directly on a new onset (see the
  # *_recovery_on_watchdog entries above), rather than only logging and
  # leaving recovery to hw_params()'s or prepare()'s own call. A stall is
  # still expected to be either short-lived or, if the recovery budget is
  # exhausted, reported loudly from jockey3_recover_urb_stream() instead (see
  # the driver_fail entries below) rather than by this watchdog going quiet.
  # Both remaining lines are counted rather than failed here, because a
  # deliberate power cut (JT-RATE-004) produces an onset too and the watchdog
  # cannot tell that apart from a real fault on its own -- what decides it is
  # whether recovery's own give-up lines follow.
  - pattern: '(?:Playback|Capture) URB stream stalled: no completion for (\d+) ms'
    metric: urb_stall_onset_ms
    capture: 1
    why: >
      The watchdog noticing that a direction stopped completing URBs. The value
      is the measured age, which is the point of the message: a wedge used to be
      found minutes later by whatever tripped over it next, and the onset could
      only be bracketed to the nearest surrounding event.
  - pattern: '(?:Playback|Capture) URB stream recovered after (\d+) ms'
    metric: urb_stall_recovered_ms
    capture: 1
    why: >
      The stream came back on its own, with no restart in between. Worth
      counting on its own terms: a stall that clears without any driver
      intervention says it was transient, which is exactly the distinction the
      escalation work is waiting on.

      Rare in practice. Every recovery path in the driver goes through a URB
      stop/start, so a stall is nearly always closed by the restart line below
      instead -- the first hardware run with the watchdog recorded 103 onsets
      and zero of these. Expected to become rarer still now that the watchdog
      calls jockey3_recover_urb_stream() directly on its own onset instead of
      only logging, since that call itself performs the stop/start.
  - pattern: '(?:Playback|Capture) URB stream restarted after stalling for (\d+) ms'
    metric: urb_stall_restarted_ms
    capture: 1
    why: >
      The other way an outage ends: a URB restart got there first. Paired with
      the onset, it is what makes "stalled and dealt with" distinguishable from
      "stalled and still stalled" after the fact.

      This exists because the restart used to clear the watchdog's flag
      silently, which left every onset unpaired and made the recovery metric
      dead on arrival. An onset with neither this nor a recovery to match it is
      a stall that never ended.
  # KUnit TAP scaffolding around the codec suite at module load. It is our
  # output, so it is classified here rather than as unrelated noise -- the
  # unrelated list is only consulted for lines that are not ours at all.
  # The verdicts are handled elsewhere: passes are counted from the summary
  # line below, failures are in driver_fail.
  - pattern: '^\s*# Subtest: ploytec'
  - pattern: '^\s*ok \d+ ploytec'
  - pattern: '^\s*# module: snd_reloop_jockey3'
  # Pinned to the suite line. KUnit emits a summary per nesting level, and a
  # '# ploytec\w*:' wildcard also swallows the two parameterized cases --
  # recording [30, 26, 21] per module load instead of [21], i.e. a metric
  # series mixing three different quantities.
  - pattern: '^\s*# ploytec-codec: pass:(\d+) fail:\d+'
    metric: kunit_cases_passed_on_target
    capture: 1
  - pattern: '^\s*# ploytec\w+: pass:\d+ fail:\d+'
    why: >
      With CONFIG_SND_USB_JOCKEY3_CODEC_KUNIT_TEST the codec suite runs at
      every module load, so the driver validates its own codec on the real
      hardware and real toolchain -- not just under QEMU.

      This counts the 21 top-level KUnit cases, which is NOT the 75 the
      catalog quotes: the parameterized cases expand into 75 individual
      results, and the kernel reports both --

          # ploytec-codec: pass:21 fail:0 skip:0 total:21
          # Totals: pass:75 fail:0 skip:0 total:75

      The metric was originally named as though it held the second number
      while reading the first. It has to read this line: "# Totals:" carries
      nothing identifying it as ours, so the classifier never offers it to
      these rules at all. Hence the deliberately specific name -- the two
      numbers are both real and measure different things, and a metric series
      is worthless if it silently changes which one it holds.

# Messages from our driver that are never acceptable, whatever the case.
driver_fail:
  - pattern: 'not ok \d+ .*ploytec'
    why: >
      A codec KUnit case failed on the target. The codec is the one part of
      this driver that is provably correct or provably not, so this is never
      ambiguous.
  - pattern: '# ploytec[\w-]*: pass:\d+ fail:[1-9]'
    why: >
      The suite's own summary reporting a non-zero failure count. This exists
      because the line above cannot be relied on alone: a failing parameterized
      case prints "not ok 5 zeros", which carries no ploytec or module name, so
      the classifier never treats it as ours and it lands in unclassified --
      surfaced for review, but not a failure. The summary line does identify
      itself as ours, so it is what turns a codec regression on target into a
      red run.
  - pattern: "unknown parameter '.*' ignored"
    why: >
      A module parameter the test framework passed was rejected. This is a
      setup defect, and it has to fail loudly because modprobe does not: a
      malformed dyndbg= query was accepted with exit status 0, the firmware
      revision was silently never logged, and every run recorded "firmware
      unknown" while otherwise passing. A run that quietly stops capturing
      what it exists to capture is worse than one that fails.
  - pattern: 'Inconsistent URB in-flight count'
    why: A self-check assertion in the driver. If it fires, accounting is wrong.
  - pattern: 'Timeout draining .* URB callbacks'
    why: >
      sync_stop gave up waiting. The next thing to happen is a use-after-free.
  - pattern: 'Rate mismatch'
    why: The hardware is not at the rate the driver believes it is at.
  - pattern: 'Capture URB too small'
    why: Endpoint delivered less than a packet; the format assumption is broken.
  - pattern: 'hardware may need power-cycling'
    why: >
      One of jockey3_recover_urb_stream()'s two give-up paths. Recovery
      escalated all the way through a full USB reset and the stream is still
      dead.
  - pattern: 'recovery budget exhausted, not resetting'
    why: >
      jockey3_recover_urb_stream()'s other give-up path: the chip-wide
      bounded-retry budget (JOCKEY3_RECOVERY_MAX_ATTEMPTS per
      JOCKEY3_RECOVERY_WINDOW_MS) was already spent, so this occurrence was
      not even escalated to a reset. Since Stage 3 trimmed the watchdog's
      periodic heartbeat, this line -- not a silent watchdog -- is what turns
      a stall nothing is dealing with into a red run.
  - pattern: 'Failed to submit (?:playback|capture|MIDI IN) URB'
    why: >
      Not the same message as the benign "Failed to RESUBMIT ... -2/-108"
      above, and not the same event. That one is a completion racing a
      deliberate teardown. This one is the ring failing to START, and -2 here
      is ENOENT from usb_submit_urb() meaning usb_pipe_endpoint() returned
      NULL -- the USB core has no such endpoint any more, while the driver
      still believes it is bound.
  - pattern: >-
      Failed to (?:initialize device to change rate|read current hardware
      rate|set rate|start streaming after rate change): -(?!19$)\d+
    why: >
      One of the four sequential stages of jockey3_set_rate()'s EP0
      handshake did not complete. With -110 it timed out: the device is
      enumerated but no longer answering. -19 (ENODEV) is excluded from all
      four here and classified benign above -- see that entry for why.
  - pattern: 'Rate change to \d+ failed: -(?!19$)\d+'
    why: >
      jockey3_pcm_hw_params()'s wrapper around jockey3_set_rate() failing for
      any reason other than the device having just gone away -- see the
      benign -19 entry for that case. Any other errno here is the rate
      change genuinely not having worked.
  - pattern: 'Started only \d+/\d+ playback and \d+/\d+ capture URBs'
    why: >
      The URB ring came up short. Only a completion handler resubmits a URB, so
      the ones that failed here are never retried: the direction runs at reduced
      depth for as long as the device stays bound, and nothing else would notice.
  - pattern: 'Endpoints are disabled after .*; the device needs a reset'
    why: >
      -ENOENT from usb_submit_urb() with the driver still bound. This is the
      2026-08-11 signature: usb_set_interface() disables an interface's
      endpoints before it sends SET_INTERFACE and does not re-enable them when
      that request fails, so a rate change against an unresponsive device leaves
      interface 0 permanently dead until something resets it.
  - pattern: 'Failed to start URBs (?:after|during|while)'
    why: >
      jockey3_start_urbs() failed for a reason other than the device having gone
      away. The stream cannot recover on its own from here.
  - pattern: '(?:Playback|Capture|MIDI IN) URB cancelled without a driver-initiated stop'
    why: >
      A URB came back -ENOENT/-ECONNRESET/-ESHUTDOWN while this driver's own
      teardown fence was clear and the device was still attached, i.e. something
      outside the driver flushed the endpoint. Defensive: no failure so far has
      been traced to this path, and if it ever fires it is new information.
  - pattern: 'Firmware version read failed'
    why: >
      The first EP0 transfer of the init handshake did not come back. Its value
      is unused, but its failure is now what stops the driver walking into
      usb_set_interface() on a device that has stopped answering -- so when this
      appears, it should be followed by an abort, not by submit failures.
  - pattern: 'Failed to clear halt on EP 0x'
    why: >
      A CLEAR_FEATURE(ENDPOINT_HALT) was refused or timed out during init. Not
      fatal on a device that is still answering, but it has never been seen on a
      healthy one either.

# ---------------------------------------------------------------------------
# NOT ours by name, but ours by device.
#
# These carry the ALSA card's identity rather than the module's, so the OURS
# regex never offers them to the rules above and they land in unclassified --
# surfaced for a human, but unable to fail anything. That is wrong for the two
# below, which are among the most diagnostic messages this driver can provoke.
#
# Matched by card-relative name (midiC<n>D<n>) rather than a fixed index,
# because the card number is not stable -- booting with the controller already
# powered on made it card0 where it had always been card1.
driver_fail_by_device:
  - pattern: 'sound midiC\d+D\d+: rawmidi drain error'
    why: >
      MIDI OUT bytes entered the rawmidi buffer and were never consumed, so
      the drain timed out -- ten seconds per write, from ALSA's own timeout.
      This driver multiplexes MIDI OUT into byte 480 of every playback packet,
      so it can only drain while the playback URBs are flowing: a drain error
      means the URB ring has died underneath a driver that still thinks it is
      running.

      Observed 2026-08-11 with avail=4090 of buffer_size=4096 -- exactly the
      six bytes of one LED message -- repeating every 10.5 s. It was the
      EARLIEST sign by several minutes, appearing long before any submit
      failed or any control transfer timed out, and at the time nothing in
      this file could fail on it. See the recovery-gap note in
      implementation_plan.md.

# Anything matching these is a defect, not a test failure. The run is marked
# INVESTIGATE and the remaining profile is abandoned: the machine needs manual
# attention, and the right response is to open an issue and look at it -- not
# to retry, and not to record a count and carry on.
investigate:
  - pattern: 'BUG:'
  - pattern: 'WARNING:'
  - pattern: 'Call Trace:'
  - pattern: 'KASAN:'
  - pattern: 'UBSAN:'
  - pattern: 'possible circular locking dependency'
  - pattern: 'possible recursive locking'
  - pattern: 'INFO: task .* blocked for more than'
  - pattern: 'general protection fault'
  - pattern: 'unable to handle (kernel )?(page fault|NULL pointer)'
  - pattern: 'Oops'
  - pattern: 'kernel panic'
  - pattern: 'list_add corruption'
  - pattern: 'refcount_t:'

# DELIBERATELY NOT CLASSIFIED
#
#   ep_05: PM: parent 1-13:1.0 should not be sleeping
#
# Seen four times during JT-PM-001 on x86_64-prod, naming this device's own
# interfaces (1-13:1.0 and 1-13:1.1) and its own endpoints -- 0x05 playback,
# 0x86 capture, 0x83 MIDI in, plus ep_02. It is a dev_warn from the PM core
# (drivers/base/power/main.c) meaning a child device was resumed while its
# parent was still suspended.
#
# It is left unclassified on purpose, so it keeps being surfaced for review.
# Adding it to `unrelated` would hide a message about our own device during
# the one case that exercises suspend; adding it to `driver_fail` would assert
# it is a driver defect, which has not been established -- the ordering may be
# usbcore's rather than ours. Decide it with evidence, then move it.
#
# Note it does not match OURS: the lines say "ep_05" and "1-13:1.0", not the
# module name. That is why it lands here rather than being attributed.

# Known-unrelated noise from the rest of the system. Ignored entirely.
#
# Keep this list short and justified. The temptation is to add anything that
# shows up twice; the cost is that a real message eventually matches one of
# these patterns and disappears. Prefer leaving something unclassified -- an
# unclassified line costs one glance, a wrongly ignored line costs a bug.
unrelated:
  # Generic KUnit/TAP framing. Unlike the ploytec-named lines above these
  # carry nothing identifying them as ours, and any suite in the kernel emits
  # them, so they are framework noise rather than driver output.
  - pattern: '^\s*(KTAP|TAP) version \d'
  - pattern: '^\s*1\.\.\d+$'
  # The codec suite's parameterized results: "ok 5 zeros", "ok 12 random00".
  # They are ours, but nothing in the text says so, and the classifier only
  # offers a line to the benign rules once it recognizes it as ours -- so
  # unrelated is the only bucket that can hold them. At 75 per module load and
  # ~20 loads in a smoke run they are the bulk of the log.
  #
  # Matched as 'ok' only, never 'not ok': a failing subtest must stay visible.
  # It lands in unclassified and is flagged, and the suite summary line in
  # driver_fail is what actually fails the run.
  - pattern: '^\s*ok \d+ [\w.-]+$'
  - pattern: '^\s*# (Subtest|Totals):'
  - pattern: '^\s*# [\w.-]+: pass:\d+ fail:\d+ skip:\d+'
  - pattern: 'usb \d+-[\d.]+: new (high|full|super)-speed USB device'
  - pattern: 'usb \d+-[\d.]+: New USB device (found|strings)'
  - pattern: 'usb \d+-[\d.]+: (Product|Manufacturer|SerialNumber):'
  - pattern: 'usb \d+-[\d.]+: USB disconnect'
  # usbcore announcing the reset the driver asked for. The driver's own
  # account of the reset is classified above as ours; this is the hub's, and
  # it carries nothing tying it to this device beyond the bus address.
  - pattern: 'usb \d+-[\d.]+: reset (high|full|super)-speed USB device'
  - pattern: 'input: .* as /devices/'
  - pattern: 'systemd\['
  - pattern: 'audit:'
  - pattern: 'perf: interrupt took too long'
  - pattern: 'pipewire|wireplumber|pulseaudio'
  # Suspend and resume. JT-PM-001 suspends the machine, so the whole PM
  # sequence lands in its window -- 52 lines of it in one functional run,
  # every one of them the kernel doing exactly what the case asked for.
  #
  # Listed specifically rather than as a blanket "PM:" prefix, because a
  # failure to suspend also announces itself through PM: and should stay
  # visible.
  - pattern: 'PM: suspend (entry|exit)'
  - pattern: 'PM: Preparing system for|PM: Restoring platform'
  - pattern: 'Restarting tasks: (Starting|Done)'
  - pattern: 'random: crng reseeded on system resumption'
  - pattern: 'efivarfs: (resyncing|finished resyncing) variable state'
  - pattern: 'ata\d+: SATA link down'
  - pattern: 'nvme nvme\d+: (D3 entry latency|\d+/\d+/\d+ default/read/poll queues)'
  - pattern: 'i915 [0-9a-f:.]+: vgaarb: VGA decodes changed'
  - pattern: 'serial \d+:\d+: activated'
  - pattern: 'Freezing (user space processes|remaining freezable tasks)'
  - pattern: 'Filesystems sync: '
  - pattern: 'OOM killer (disabled|enabled)'
  - pattern: 'printk: Suspending console'
  - pattern: 'smpboot: CPU \d+ is now offline'
  - pattern: 'smpboot: Booting Node \d+ Processor \d+'
  - pattern: '(Disabling|Enabling) non-boot CPUs'
  - pattern: 'CPU\d+ is up'
  # Specific EC transitions rather than a blanket "ACPI: EC:", so a genuine
  # embedded-controller complaint still surfaces.
  - pattern: 'ACPI: EC: (interrupt (un)?blocked|event (un)?blocked|EC (stopped|started))'
  - pattern: 'ACPI: PM: '
  - pattern: 'serial \d+:\d+: disabled'
  - pattern: 'e1000e: EEE TX LPI TIMER'
