# Profiles: which cases run, how many times, with what parameters.
#
# There is ONE definition of each profile, not a separate variant per machine.
# What differs per target lives in `overrides`, and carries both iteration
# counts and parameters -- because scaling a test down is not always a matter
# of running it fewer times. On the Pi 1B the audio cases run at 44.1 and
# 48 kHz only; the high rates are skipped, not merely reduced.
#
#   iterations: 0   disables the case on that target
#   params:         merged over the case's defaults from catalog.yaml
#
# Cases listed in a profile but not runnable on the current target -- because
# a required capability is missing -- are recorded as skipped with the reason.
# They are never silently omitted, because a silently omitted case looks
# identical to a passing one in a summary.

version: 1

profiles:

  build:
    description: >
      Static/build gates and Unit/Component tests only. Needs no hardware, so
      it runs on the build host -- and identifies its target from the kernel
      tree being built, not from the machine it happens to run on.
    cases:
      - {id: JT-BUILD-001, iterations: 1}
      - {id: JT-BUILD-002, iterations: 1}
      - {id: JT-BUILD-003, iterations: 1}
      - {id: JT-BUILD-004, iterations: 1}
      - {id: JT-BUILD-005, iterations: 1}
      - {id: JT-CODEC-001, iterations: 1}
      - {id: JT-CODEC-002, iterations: 1}
      - {id: JT-CODEC-003, iterations: 1}
      - {id: JT-CODEC-004, iterations: 1}
      - {id: JT-MIDI-006,  iterations: 1}

  smoke:
    description: >
      Does this build work at all? Run after every deploy. Minutes, not hours.
    cases:
      - {id: JT-BUILD-006, iterations: 1}
      - {id: JT-PROBE-001, iterations: 3}
      - {id: JT-PROBE-002, iterations: 3, params: {iterations_per_run: 5}}
      - {id: JT-PROBE-003, iterations: 1, params: {iterations_per_run: 3}}
      - {id: JT-PCM-002,   iterations: 1, params: {rates: [44100, 96000], seconds: 2}}
      - {id: JT-PCM-004,   iterations: 1, params: {rates: [44100], seconds: 2}}
      - {id: JT-RATE-001,  iterations: 1, params: {iterations_per_run: 3}}
      - {id: JT-AUDIO-002, iterations: 1}
      - {id: JT-AUDIO-005, iterations: 1, params: {iterations_per_run: 3}}
    overrides:
      armhf-prod:
        # See re/pi1test_platform_notes.md: udev's own brief hold on a
        # newly-appeared card's control node can outlive load on this
        # single-core board, making rmmod fail with "Module ... is in use".
        JT-PROBE-001: {params: {settle_delay_s: 3}}
        JT-PCM-002: {params: {rates: [44100], seconds: 2}}
        # Stays at the rates this target's constraints allow. The 8% step
        # between them is below JT-RATE-001's timing tolerance, so the rate
        # check is blind here and the case says so in its notes -- the stall
        # and capture-liveness checks still do their work. Whether the Pi can
        # in fact manage 96 kHz is an open question (targets.yaml, UNVERIFIED)
        # and belongs in a measurement of its own, not in a silent change to
        # this profile.
        JT-RATE-001: {params: {rates: [44100, 48000], iterations_per_run: 3}}
        # 2026-08-25: an 88200 Hz capture during JT-AUDIO-002 left an
        # unkillable arecord stuck for ~46 minutes and the board unreachable
        # over ssh (sustained ~30k interrupts/s) until a rate change to
        # 44100 Hz cleared it -- see re/pi1test_platform_notes.md. `functional`
        # already restricted this case's rates for the same reason; smoke
        # hadn't been updated to match.
        JT-AUDIO-002: {params: {rates: [44100, 48000]}}
      x86_64-debug:
        JT-PROBE-001: {iterations: 5}

  functional:
    description: >
      Every behavior exercised at least once. Run before calling a change done.
    cases:
      - {id: JT-BUILD-001, iterations: 1}
      - {id: JT-BUILD-002, iterations: 1}
      - {id: JT-BUILD-003, iterations: 1}
      - {id: JT-BUILD-004, iterations: 1}
      - {id: JT-BUILD-006, iterations: 1}
      - {id: JT-CODEC-001, iterations: 1}
      - {id: JT-CODEC-002, iterations: 1}
      - {id: JT-MIDI-006,  iterations: 1}
      - {id: JT-PROBE-001, iterations: 5}
      - {id: JT-PROBE-002, iterations: 1}
      - {id: JT-PROBE-003, iterations: 1}
      - {id: JT-PCM-001,   iterations: 1}
      - {id: JT-PCM-002,   iterations: 1}
      - {id: JT-PCM-004,   iterations: 1}
      - {id: JT-PCM-005,   iterations: 1}
      - {id: JT-PCM-006,   iterations: 1}
      - {id: JT-PCM-009,   iterations: 1}
      - {id: JT-RATE-001,  iterations: 1, params: {iterations_per_run: 25}}
      - {id: JT-RATE-002,  iterations: 1}
      - {id: JT-AUDIO-001, iterations: 1, params: {rates: [44100, 96000]}}
      - {id: JT-AUDIO-002, iterations: 1}
      - {id: JT-AUDIO-003, iterations: 1}
      - {id: JT-AUDIO-005, iterations: 1, params: {iterations_per_run: 3}}
      - {id: JT-MIDI-001,  iterations: 1}
      - {id: JT-MIDI-002,  iterations: 1}
      - {id: JT-MIDI-004,  iterations: 1}
      - {id: JT-PM-001,    iterations: 1}
      - {id: JT-PM-002,    iterations: 1}
      - {id: JT-HOTPLUG-001, iterations: 1}
      - {id: JT-HOTPLUG-002, iterations: 1}
    overrides:
      armhf-prod:
        # A bounded pass: does it load, play, capture, respond to MIDI, and
        # survive a power cycle? Everything else is somebody else's target.
        JT-BUILD-001: {iterations: 0}
        JT-BUILD-002: {iterations: 0}
        JT-BUILD-003: {iterations: 0}
        JT-BUILD-004: {iterations: 0}
        JT-CODEC-001: {iterations: 0}
        JT-CODEC-002: {iterations: 0}
        JT-MIDI-006:  {iterations: 0}
        # See re/pi1test_platform_notes.md: udev's own brief hold on a
        # newly-appeared card's control node can outlive load on this
        # single-core board, making rmmod fail with "Module ... is in use".
        JT-PROBE-001: {params: {settle_delay_s: 3}}
        JT-PROBE-002: {iterations: 0}
        # Power-cycling is slow on a Pi 1B and re-enumeration is the slowest
        # part of it. Three cycles still catches a slot leak, which increments
        # every cycle; ten would only catch it three times over.
        JT-PROBE-003: {params: {iterations_per_run: 3}}
        JT-PCM-001:   {params: {iterations_per_run: 20}}
        JT-PCM-002:   {params: {rates: [44100, 48000], seconds: 2}}
        JT-PCM-004:   {params: {rates: [44100, 48000], seconds: 2}}
        JT-PCM-005:   {params: {rates: [44100]}}
        JT-RATE-001:  {params: {rates: [44100, 48000], iterations_per_run: 10}}
        JT-RATE-002:  {iterations: 0}
        JT-AUDIO-001: {params: {rates: [44100, 48000]}}
        JT-AUDIO-002: {params: {rates: [44100, 48000]}}
        # No onboard RTC and the kernel advertises no suspend-to-RAM support
        # (see lib/capabilities.py's rtc-wake probe) -- not a gap in this
        # Pi's config, the board itself has neither. Disabled rather than
        # left to block every run.
        JT-PM-001:    {iterations: 0}
        JT-PM-002:    {iterations: 0}
        JT-MIDI-004:  {params: {rates: [44100, 48000]}}
        # exclude the application/interopability tests for the pi1
        JT-INTEROP-001: {iterations: 0}
        JT-INTEROP-002: {iterations: 0}
        JT-INTEROP-003: {iterations: 0}
        JT-INTEROP-004: {iterations: 0}
      arm64-prod:
        JT-BUILD-001: {iterations: 0}
        JT-BUILD-002: {iterations: 0}
        JT-BUILD-003: {iterations: 0}
        JT-BUILD-004: {iterations: 0}
        JT-RATE-001:  {params: {iterations_per_run: 15}}
        # Same reasoning as armhf-prod above: the Pi 4B has no onboard RTC
        # and no suspend-to-RAM support.
        JT-PM-001:    {iterations: 0}
        JT-PM-002:    {iterations: 0}
      x86_64-debug:
        # Audio quality cannot be judged on a KASAN kernel -- see the
        # constraints on this target in targets.yaml. JT-AUDIO-003 asks whether
        # music plays without clicks, and on this target the answer is no for
        # reasons that have nothing to do with the driver. Running it would
        # record a fail against the driver for the kernel's overhead, which is
        # worse than not running it.
        #
        # The channel sweep stays: it asks which output a tone came from and at
        # what pitch, and a crackle does not make that ambiguous.
        JT-AUDIO-003: {iterations: 0}
      arm64-debug:
        JT-AUDIO-003: {iterations: 0}

  regression:
    description: >
      Everything, with enough repetition to catch intermittent faults. A few
      hours. Run before a submission, and after anything touching URB
      lifetime, locking or the reset path.
    cases:
      - {id: JT-BUILD-001, iterations: 1}
      - {id: JT-BUILD-002, iterations: 1}
      - {id: JT-BUILD-003, iterations: 1}
      - {id: JT-BUILD-004, iterations: 1}
      - {id: JT-BUILD-005, iterations: 1}
      - {id: JT-BUILD-006, iterations: 1}
      - {id: JT-CODEC-001, iterations: 1}
      - {id: JT-CODEC-002, iterations: 1}
      - {id: JT-CODEC-003, iterations: 1}
      - {id: JT-CODEC-004, iterations: 1}
      - {id: JT-MIDI-006,  iterations: 1}
      - {id: JT-PROBE-001, iterations: 10, params: {iterations_per_run: 20}}
      - {id: JT-PROBE-002, iterations: 1, params: {iterations_per_run: 200}}
      - {id: JT-PROBE-003, iterations: 1}
      - {id: JT-PCM-001,   iterations: 1, params: {iterations_per_run: 500}}
      - {id: JT-PCM-002,   iterations: 3}
      - {id: JT-PCM-003,   iterations: 1}
      - {id: JT-PCM-004,   iterations: 3}
      - {id: JT-PCM-005,   iterations: 3}
      - {id: JT-PCM-006,   iterations: 1}
      - {id: JT-PCM-007,   iterations: 1}
      # Mileage, not accuracy: 250 loops exist to measure how often the
      # capture stall happens, and at the catalog's 4 s per rate that would be
      # over an hour. One second per rate puts the timing check below its
      # enforcement threshold -- recorded, not enforced -- which is the right
      # trade here and is stated in the case's notes on every run.
      - {id: JT-RATE-001,  iterations: 1, params: {iterations_per_run: 250, seconds_per_rate: 1}}
      - {id: JT-RATE-002,  iterations: 1}
      - {id: JT-RATE-004,  iterations: 1}
      - {id: JT-AUDIO-001, iterations: 1}
      - {id: JT-AUDIO-002, iterations: 1}
      - {id: JT-AUDIO-003, iterations: 1}
      - {id: JT-AUDIO-004, iterations: 1}
      - {id: JT-AUDIO-005, iterations: 1, params: {iterations_per_run: 20}}
      - {id: JT-MIDI-001,  iterations: 1}
      - {id: JT-MIDI-002,  iterations: 1}
      - {id: JT-MIDI-004,  iterations: 1}
      - {id: JT-MIDI-005,  iterations: 1}
      - {id: JT-PM-001,    iterations: 3}
      - {id: JT-PM-002,    iterations: 3}
      - {id: JT-HOTPLUG-001, iterations: 1}
      - {id: JT-HOTPLUG-002, iterations: 1}
      - {id: JT-HOTPLUG-003, iterations: 1}
    overrides:
      armhf-prod:
        # The Pi 1B does not get a regression pass. Use `functional`.
        # See re/pi1test_platform_notes.md: udev's own brief hold on a
        # newly-appeared card's control node can outlive load on this
        # single-core board, making rmmod fail with "Module ... is in use".
        JT-PROBE-001: {params: {settle_delay_s: 3}}
        JT-RATE-001: {iterations: 0}
        JT-PCM-001:  {iterations: 0}
        JT-PROBE-002: {iterations: 0}
        # See re/pi1test_platform_notes.md: an 88200 Hz capture wedged an
        # arecord process for ~46 minutes during a smoke run.
        JT-AUDIO-002: {params: {rates: [44100, 48000]}}
        # No onboard RTC, no suspend-to-RAM support -- see the note under
        # `functional`.
        JT-PM-001:   {iterations: 0}
        JT-PM-002:   {iterations: 0}
      arm64-prod:
        # Same reasoning as armhf-prod above: the Pi 4B has no onboard RTC
        # and no suspend-to-RAM support.
        JT-PM-001:   {iterations: 0}
        JT-PM-002:   {iterations: 0}
      x86_64-debug:
        # See the note under `functional`: quality verdicts are void here.
        JT-AUDIO-003: {iterations: 0}
        JT-AUDIO-004: {iterations: 0}
      arm64-debug:
        JT-AUDIO-003: {iterations: 0}
        JT-AUDIO-004: {iterations: 0}

  soak:
    description: >
      Endurance only. Run overnight, on one target at a time. The metric that
      matters is drift, not the final verdict. This profile's own cases run
      for hours (JT-PCM-008, JT-MIDI-007, JT-RATE-003), well past runner.py's
      default --timeout of 3600s. JT-RATE-003 carries its own 'timeout' in
      catalog.yaml, but JT-PCM-008 and JT-MIDI-007 do not -- pass --timeout
      comfortably above their configured duration or they are killed
      partway through with no result.
    cases:
      - {id: JT-BUILD-006, iterations: 1}
      - {id: JT-PROBE-001, iterations: 1}
      - {id: JT-PCM-008, iterations: 1}
      - {id: JT-RATE-003, iterations: 1}
      - {id: JT-PROBE-005, iterations: 1}
      - {id: JT-MIDI-007, iterations: 1, params: {duration_seconds: 7200}}
      - {id: JT-INTEROP-004, iterations: 1}
      # Thirty cold boots rather than the usual ten. Ten cycles cannot tell a
      # true 0% failure rate from about 25%, which is fine while bisecting a
      # wide interval and useless for confirming the shipped settling delay.
      # The fault is deterministic when present, so this is about the margin
      # above the fall-over, not about catching a rare event.
      - {id: JT-AUDIO-005, iterations: 1, params: {iterations_per_run: 30}}
    overrides:
      armhf-prod:
        # See re/pi1test_platform_notes.md: udev's own brief hold on a
        # newly-appeared card's control node can outlive load on this
        # single-core board, making rmmod fail with "Module ... is in use".
        JT-PROBE-001: {params: {settle_delay_s: 3}}
        JT-PCM-008: {params: {hours: 2, rate: 44100}}
        JT-RATE-003: {params: {iterations_per_run: 500}}
        JT-PROBE-005: {iterations: 0}
        JT-MIDI-007: {params: {duration_seconds: 3600}}
        JT-INTEROP-004: {iterations: 0}
      arm64-prod:
        JT-PCM-008: {params: {hours: 4}}
        JT-RATE-003: {params: {iterations_per_run: 2000}}
      x86_64-debug:
        # KASAN makes the machine slow enough that an 8-hour soak covers much
        # less ground; the point here is the memory checking, not the mileage.
        JT-PCM-008: {params: {hours: 4}}
        # The wedge this hunts is a device-side fault, so mileage on a fast
        # prod kernel is worth more than memory checking on a slow one. Same
        # reasoning as armhf-prod/arm64-prod above: fewer changes on a kernel
        # that is already slow for other reasons.
        JT-RATE-003: {params: {iterations_per_run: 1000}}
        JT-MIDI-007: {params: {duration_seconds: 3600}}
        JT-INTEROP-004: {iterations: 0}
