# Test catalog for the Reloop Jockey 3 driver.
#
# The register of every test case, whether or not it is implemented yet. A
# catalog that lists only what already works cannot show a gap, and showing
# gaps is half the point -- so unimplemented cases are listed with
# `status: planned` and appear in coverage reports as untested.
#
# See ../../docs/test_strategy.md for what the levels and areas mean.
#
# Fields
#   id            JT-<AREA>-<nnn>. Stable forever. Never encodes level or mode.
#   title         One line, imperative or descriptive.
#   area          BUILD CODEC PROBE PCM RATE AUDIO MIDI PM HOTPLUG SOAK
#   level         L1..L5 -- scope of what is exercised, not who runs it.
#   mode          automated | manual | semi-automated
#   status        implemented | planned | idea | deprecated | removed
#   requires      capability tokens the target must provide (see targets.yaml)
#   per_target    true forces ledger.py to key an L1/L2 case's result by target
#                 rather than folding it into "(source)". Use only when the
#                 case's result is genuinely a property of the host, not the
#                 source -- e.g. a throughput number, not a pass/fail verdict.
#   exec          automated only: script under cases/, relative to tests/hw
#   args          automated only: fixed arguments appended to exec
#   params        default parameters; profiles may override per target
#   metrics       names of values this case records beyond pass/fail
#   pass          what counts as a pass
#   expect_dmesg  driver messages that are NORMAL for this case (regexes)
#   steps         manual only: what the operator does
#   notes         anything worth knowing before running or changing it

version: 1

areas:
  BUILD:   Source as text and as a compilation unit
  CODEC:   The Ploytec bit-plane codec in isolation
  PROBE:   Enumeration, binding, module lifecycle
  PCM:     PCM substream lifecycle, formats, limits
  RATE:    Sample-rate switching and its recovery paths
  AUDIO:   Audio actually produced and captured
  MIDI:    Control surface in, LEDs out, running status
  PM:      Suspend, resume, reset
  HOTPLUG: Disconnect, replug, power loss
  INTEROP: Interoperability and integration with other subsystems
  PERF:    Host CPU, interrupt and power cost of the driver
#  SOAK:    Endurance and high repetition  -- deprecated in favor of L5

levels:
  L1:      Build and static analysis
  L2:      Unit tests (no hardware)
  L3:      Driver functional tests
  L4:      Integration/interoperability tests
  L5:      Endurance and stability tests

cases:

  # ------------------------------------------------------------------ BUILD

  - id: JT-BUILD-001
    title: checkpatch --strict against the upstream base
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [checkpatch]
    metrics: [checkpatch_warnings]
    pass: No checkpatch errors or warnings on the diff against origin/for-next.
    notes: >
      FILE_PATH_CHANGES is ignored -- checkpatch raises it on the first added
      file of any patch without checking whether MAINTAINERS was touched, and
      this series does update MAINTAINERS.

  - id: JT-BUILD-002
    title: Build clean at W=12
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [build]
    metrics: [build_warnings]
    pass: Module builds with zero warnings at W=12.
    notes: >
      Two -Wshadow warnings are expected and are not defects: 'index' in
      jockey3.c is the standard ALSA module-param idiom, and '__ret' comes from
      the wait_event_lock_irq_timeout() macro. Both are filtered, not silenced.

  - id: JT-BUILD-003
    title: Documentation gates -- kernel-doc, codespell, rst
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [docs]
    metrics: []
    pass: kernel-doc -Wall -Werror, codespell and rst2html --strict all clean.

  - id: JT-BUILD-004
    title: Module size
    area: BUILD
    level: L1
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/build_gate.py
    args: [size]
    metrics: [ko_bytes, text_bytes, data_bytes, bss_bytes]
    pass: Metric-only. Records size; never fails.
    notes: >
      Answers "why did it grow fat?". Deliberately has no threshold -- a
      threshold would either be too loose to catch anything or would fail the
      build for a legitimate feature.

  - id: JT-BUILD-005
    title: Cross-compile for every target architecture
    area: BUILD
    level: L1
    mode: automated
    status: planned
    requires: [kernel-tree, cross-toolchains]
    metrics: [arches_built]
    pass: The module builds for x86_64, i386, arm64 and armhf.
    notes: >
      Catches arch-specific breakage without hardware. Partly covered today by
      the KUnit cross matrix, which builds the driver for six architectures as
      a side effect.

  - id: JT-BUILD-006
    title: Running kernel's config matches its own target label
    area: BUILD
    level: L3
    mode: automated
    status: implemented
    requires: []
    per_target: true
    exec: cases/config_check.py
    pass: >
      Every symbol tests/configs/config-flags.sh requires is on, every symbol
      it forbids is off, and -- for a debug-flavored target -- every symbol a
      -debug config must carry is on. A production target additionally
      requires the whole debug-only symbol set to be off, not just the three
      LOCALVERSION-adjacent ones targets.yaml's own preflight checks.
    notes: >
      Every other case's result is only as trustworthy as the kernel it ran
      under, and a mislabeled kernel looks identical from the outside --
      it enumerates, plays, captures. Reads /proc/config.gz on the running
      kernel and checks it against config-flags.sh directly (by parsing the
      file, not by copying its symbol lists) so this and derive-prod.sh
      cannot silently disagree about what "debug" or "prod" means. This is
      the arm64-debug/-prod drift found and fixed on 2026-08-18 turned into a
      standing check, so it shows up as a coverage gap in ledger.py --matrix
      rather than needing to be rediscovered by hand next time.

      Deliberately level L3, not L1, despite the BUILD area and numbering:
      it checks the RUNNING kernel via /proc/config.gz, so it needs
      needs_running_kernel() to resolve the target from the booted kernel
      (env.kernel_info()) rather than from a cross-compile tree in
      ~/sound/.config the way JT-BUILD-001..005 do. It belongs in the
      hardware profiles (smoke/functional/regression/soak), not in `build`,
      which identifies its target from the tree being built and would
      misattribute this case's verdict to whatever the build host's own
      unrelated kernel happens to be running.

  # ------------------------------------------------------------------ CODEC

  - id: JT-CODEC-001
    title: KUnit codec suite under UML
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/codec_kunit.py
    args: [um]
    metrics: [tests_run, tests_passed]
    pass: All 75 tests pass.

  - id: JT-CODEC-002
    title: User-space bench correctness, all codec variants
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: []
    exec: cases/codec_bench.py
    args: [test]
    metrics: [variants_tested]
    pass: reference, opt64, opt32 and every candidate agree with the golden vectors.
    notes: >
      Also fails if build/src has drifted from the driver source, so a result
      cannot be attributed to the wrong revision.

  - id: JT-CODEC-003
    title: KUnit codec suite across the full architecture matrix
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: [kernel-tree, cross-toolchains, qemu]
    exec: cases/codec_kunit.py
    args: [um, i386, arm64, arm, riscv]
    metrics: [tests_run, tests_passed, arches_run]
    pass: 75/75 on every architecture.
    notes: >
      Slow (minutes per architecture). Belongs in regression, not smoke.
      s390 is opt-in via --extra and exists purely as a big-endian proof, so
      it is deliberately not in this case's target list.

  - id: JT-CODEC-004
    title: KUnit codec suite against the portable reference codec
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/codec_kunit.py
    args: [--ref, um]
    metrics: [tests_run, tests_passed, arches_run]
    pass: 75/75 with CONFIG_SND_USB_JOCKEY3_REFERENCE_CODEC=y.
    notes: >
      The reference codec is what the optimized variants are validated against,
      so it must itself be validated against the golden vectors. um only --
      the reference codec is architecture-independent by construction (no
      SWAR word-size tricks), so the cross/QEMU matrix that JT-CODEC-003
      exists for buys nothing here.

  - id: JT-CODEC-005
    title: Codec throughput benchmark
    area: CODEC
    level: L2
    mode: automated
    status: implemented
    requires: [quiet-machine]
    per_target: true
    exec: cases/codec_throughput.py
    metrics: [encode_mbps, decode_mbps, encode_speedup, decode_speedup,
              encode_rsd_percent, decode_rsd_percent]
    pass: Metric-only. encode_mbps/decode_mbps are megabytes/second.
    notes: >
      Must run natively -- QEMU timings are meaningless. Needs a machine that
      is otherwise idle, so it is not part of any routine profile. Reports
      the optimized variant this host would actually ship (opt64 or opt32,
      by word size) against the portable reference, measured in the same
      run so both sides share thermal/noise conditions. Not in any profile;
      invoke directly with --case JT-CODEC-005.

  # ------------------------------------------------------------------ PROBE

  - id: JT-PROBE-001
    title: Module load and unload cycle
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_cycle.py
    params:
      iterations_per_run: 3
      # Pause after a load, before attempting unload. Default 0: on the
      # targets this was written against, nothing outlives the load fast
      # enough to make rmmod fail. armhf-prod (pi1test) overrides this to a
      # few seconds in profiles.yaml -- see re/pi1test_platform_notes.md for
      # why: on that single-core board, udev's own brief open of a
      # newly-appeared card's control node (no sound server runs there) can
      # still be in flight when rmmod would otherwise fire immediately after
      # load, and "Module ... is in use" is udev's transient hold, not the
      # driver's.
      settle_delay_s: 0
    metrics: [probe_ms, load_ms, unload_ms]
    pass: >
      The card appears with a playback and a capture substream and one rawmidi
      device after every load, and unloads cleanly every time.
    notes: >
      Also the case that captures the build identity and firmware revision for
      the run, so it should run early in every profile.

      The firmware message needs no expect_dmesg entry here: it is emitted on
      every rate change as well as at probe, so it lives in lib/rules.yaml as
      a global rule. Listing it in both places would be two sources of truth
      for one fact.

  - id: JT-PROBE-002
    title: Unbind and rebind stress
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_bind_unbind.py
    params:
      iterations_per_run: 50
      settle_seconds: 5
    metrics: [bind_ms, unbind_ms, bind_call_ms, unbind_call_ms, slots_used]
    pass: No memory errors, no double free, no leak across the cycles.
    notes: >
      Derived from scripts-alsa-dev/bind_unbind_test.sh. The reason it exists:
      devres was replaced with manual devm actions (jockey3_kfree_action), so
      the plausible regression is a leak or double free on the init-failure and
      disconnect paths. Only meaningful on a KASAN kernel.

      Unlike JT-PROBE-001 this drives the driver's bind/unbind through sysfs
      (/sys/bus/usb/drivers/snd-reloop-jockey3/{bind,unbind}) via
      jockey3-testctl rather than modprobe/rmmod: the module stays loaded and
      the device stays on the bus, so this exercises jockey3_probe() and
      jockey3_disconnect() specifically rather than module init/exit as well.
      This case does not classify dmesg itself -- that stays the runner's job
      per lib/case.py -- it only runs enough cycles for lib/rules.yaml's
      existing BUG:/KASAN: rules to have something to catch.

      bind_ms/unbind_ms are measured from when the jockey3-testctl call
      returns, not from when it starts, because the sysfs unbind write is
      synchronous and the helper call itself (sudo, bash, resolving the
      interface by vendor/product id) is tool cost, not driver work -- see
      hotplug_cycle.py's switch_ms for the same split done for JT-PROBE-003.
      That cost is recorded separately as bind_call_ms/unbind_call_ms so it
      cannot be mistaken for the thing being measured. slots_used repeats the
      JT-PROBE-003 card-index-reuse check, since a slot leak is exactly the
      shape a devm double-free would take if it corrupted card teardown
      instead of crashing outright.

  - id: JT-PROBE-003
    title: Card slot reuse across repeated unplug and replug
    area: PROBE
    level: L3
    mode: automated
    status: implemented
    requires: [device, usb-power]
    exec: cases/hotplug_cycle.py
    params:
      iterations_per_run: 10
      off_seconds: 2
      settle_seconds: 8
    metrics: [slots_used, card_index_first, card_index_last, enumerate_ms,
              teardown_ms, switch_ms, pcm_settle_ms, cycles]
    pass: >
      The device re-enumerates after every power cycle, with a playback and a
      capture substream and one rawmidi device, and the card index is reused
      rather than climbing. No slot leak after many cycles.
    expect_dmesg:
      - 'Failed to resubmit (?:playback|capture|MIDI IN) URB: -19$'
    steps:
      - >
        Note the current card index:
        awk '/RJ3/{print $1}' /proc/asound/cards
      - Unplug the USB cable, confirm the card disappears from /proc/asound/cards.
      - Plug it back in, confirm the card reappears.
      - >
        Repeat about ten times, and confirm the card index is REUSED rather
        than incrementing each cycle -- a climbing index is the slot leak
        this case exists to catch.
      - Confirm each replug still has a playback and a capture substream and
        one rawmidi device.
    notes: >
      Slot allocation is a bitmap under a mutex, so the failure is an index
      that climbs until it runs out rather than anything louder.

      Automated via per-port power switching on a ppps-capable USB hub
      (uhubctl), which the privileged helper drives through `usb-power`. On a
      machine without such a hub the case demotes to the manual steps above
      and is offered by checklist.py -- the coverage is worth having either
      way, and only the labor differs.

      A port power-off is NOT equivalent to pulling the cable. It is a clean,
      immediate VBUS drop: the device vanishes at once, resubmits fail
      synchronously with -19, and the -71 (EPROTO) burst a real unplug
      produces never happens. Measured 2026-08-10, idle and under active
      playback alike. That is fine for THIS case, which is about enumeration
      and slot reuse -- but it means the URB error give-up path is not
      exercised here. See JT-HOTPLUG-001 and JT-HOTPLUG-003.

  - id: JT-PROBE-004
    title: Reject a device with missing or malformed endpoints
    area: PROBE
    level: L3
    mode: automated
    status: idea
    requires: [gadget-emulation]
    pass: probe() fails cleanly with no resource leak.
    notes: >
      jockey3_validate_endpoints() is an error path that real hardware can
      never exercise. Would need a USB gadget or dummy_hcd emulating a
      malformed descriptor. Low priority, high novelty. Status is "idea"
      rather than "planned": there is no foreseeable way to mock a faulty
      Jockey 3 firmware, so this stays in the catalog but out of --list and
      the ledger until that changes.

  - id: JT-PROBE-005
    title: Bind and unbind endurance
    area: PROBE
    level: L5
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/probe_bind_unbind.py
    # 5000 iterations at settle_seconds=5 alone is ~7h before any actual
    # bind/unbind time; the runner's own default timeout is 3600s, so
    # without an explicit one here this aborts partway through every time
    # (see JT-PCM-008/JT-RATE-003 for the same fix). An explicit --timeout
    # on the command line still wins.
    timeout: 43200
    params:
      iterations_per_run: 5000
      settle_seconds: 5
    metrics: [bind_ms, unbind_ms, bind_call_ms, unbind_call_ms, slots_used]
    pass: No leak and no failure across thousands of cycles.
    notes: >
      Only meaningful on a KASAN kernel. The long form of JT-PROBE-002 --
      same case, cases/probe_bind_unbind.py, run for 5000 cycles instead of
      50. The metrics list matches JT-PROBE-002's rather than the
      memory_growth_kb/failures pair originally sketched here: the case
      breaks on the first failed cycle rather than counting failures across
      the run (consistent with probe_cycle.py and hotplug_cycle.py, and with
      the fact that classifying dmesg for a leak is the runner's job, not
      this case's -- see the JT-PROBE-002 notes above), so there is nothing
      for a "failures" metric to report beyond pass/fail. A slab-memory
      growth metric could be added later if a non-KASAN endurance signal
      turns out to be worth having, but the case script does not attempt it.

      Formerly JT-SOAK-003. The SOAK area predated the L1..L5 test-level
      scheme, whose L5 (endurance/stability) already covers what SOAK was
      standing in for; each former SOAK case moved into the area it actually
      belongs to and kept its level: L5.

  # -------------------------------------------------------------------- PCM

  - id: JT-PCM-001
    title: PCM open and close cycling
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_open_close.py
    params:
      iterations_per_run: 100
    metrics: [open_ms]
    pass: Every open succeeds and every close releases the substream.
    notes: >
      Derived from scripts-alsa-dev/test_open_close.sh. Not redundant with
      JT-PCM-002/004/005 and friends: those each open a substream once per run
      and spend the run on whatever they actually measure. This is the only
      case that repeats the open/close cycle itself, hundreds of times back to
      back with no playback or capture content of interest, so it is the one
      that would catch a leak or a state-release bug that only shows up on the
      Nth open. Playback and capture are cycled independently with
      aplay/arecord --samples (not --duration), so the cost per cycle does not
      depend on rate.

  - id: JT-PCM-002
    title: Playback at each supported rate
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/pcm.py
    args: [playback]
    params:
      rates: [44100, 48000, 88200, 96000]
      seconds: 3
    metrics: [xruns, first_audio_ms]
    pass: >
      Playback runs to completion at every requested rate with no xruns
      reported by the PCM status.
    expect_dmesg:
      - 'Playback URB has stalled\.'

  - id: JT-PCM-003
    title: Period and buffer size boundary matrix
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_limits.py
    params:
      period_sizes: [minimum, 120, 144, 1024, maximum]
      period_counts: [2, 4, 1024]
    metrics: [xruns, configs_accepted, configs_rejected]
    pass: >
      Every configuration inside the advertised limits works; every one outside
      is refused rather than accepted and then failing.
    notes: >
      From buffer_limits_validation.md. period_bytes_min is 120 for playback
      and 144 for capture, matching one URB payload. The interesting inputs are
      sizes that are not multiples of the frame size (12 bytes playback,
      18 capture), because the packet loop's wrap-around arithmetic depends on
      that division.

  - id: JT-PCM-004
    title: Capture at each supported rate
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm.py
    args: [capture]
    params:
      rates: [44100, 48000, 88200, 96000]
      seconds: 3
    metrics: [xruns, captured_bytes, nonzero_channels]
    pass: >
      Capture produces the expected byte count at every rate. With nothing
      connected to the inputs the data may be silent, so silence is not a
      failure here -- JT-AUDIO-004 is what checks signal presence.
    expect_dmesg:
      - 'Capture URB has stalled\.'

  - id: JT-PCM-005
    title: Simultaneous playback and capture
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/pcm.py
    args: [duplex]
    params:
      rates: [44100, 96000]
      seconds: 4
    metrics:
      - xruns_playback
      - xruns_capture
      - avail_max_playback
      - avail_max_capture
      - rms_dbfs
      - rms_dbfs_min
    pass: Both directions run concurrently without xruns.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
    notes: >
      Full duplex is the normal DJ case and stresses both URB rings and the
      lock ordering at once.

      rms_dbfs is the per-channel capture level, printed on the terminal as
      the case runs and recorded per rate. It is informational only and never
      fails the case: with nothing plugged into the inputs a noise floor
      around -90 to -110 dBFS is the correct reading; with a loopback cable
      and a known source it will read far higher. Only whoever is running the
      case knows what is plugged in, so the number is surfaced for them to
      judge rather than compared against a threshold here -- the same reason
      JT-PCM-004 does not fail on silence either. rms_dbfs_min is the worst
      (highest) channel of that same reading, alone, so the ledger has a
      single scalar to trend across runs.

      Superseded the manual steps that used a fixed 20 s arecord and
      actions/play_channel_sweep.sh in two terminals -- cases/pcm.py's duplex
      mode does the same thing under runner.py, plus the level.

      Worth automating: the verdict is "no xruns, both ran", which needs no
      human judgement. Manual only until someone writes the case.

  - id: JT-PCM-006
    title: Unsupported hw_params are refused
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm_hw_params_refused.py
    metrics: [configs_tested, configs_accepted, configs_refused]
    pass: >
      Wrong channel counts, unsupported formats and unsupported rates are
      rejected at hw_params rather than accepted and then misbehaving.
    notes: >
      Channels are fixed (4 playback, 6 capture) and the only format is
      S24_3LE, so this is a short, cheap and genuinely useful case.

      For each stream, three individually-wrong configs (channel count,
      format, rate) must be refused, and one all-correct control must
      succeed. The control is the one that makes it a test rather than a
      formality: four commands that all fail prove nothing if the fifth
      would have failed too.

      The accept/refuse verdict comes from libasound's exact hw_params
      setters (dir=0), not aplay/arecord's exit code: aplay's -r negotiates
      rate with snd_pcm_hw_params_set_rate_near(), which silently rounds an
      unsupported rate to the nearest one the device offers and exits 0,
      the same "near" rounding trap pcm_limits.py (JT-PCM-003) documents
      for period and buffer size. Channels and format have no such
      rounding, but rate does, so all three are probed the exact way for
      consistency. Confirmed on hardware: an earlier plain-exit-code
      version of this case reported the unsupported-rate probe as refused
      when aplay had actually been rounded to 44100 and never asked the
      driver for 22050 at all.

      No dmesg check for "accepted and then coped": classification from the
      kernel log is the runner's job (see lib/case.py), not the case's.

      Use hw: and never plughw: -- plughw exists precisely to convert these
      away, and would turn every case here into a pass.

  - id: JT-PCM-007
    title: Achievable latency sweep
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/pcm_latency_sweep.py
    metrics: [min_clean_period_bytes, min_clean_latency_ms]
    pass: >
      Metric-only for the sweep itself. Fails only if a legal-range period
      is refused by hw_params (disagreement with JT-PCM-003), or if nothing
      up to a generous 32 KiB ceiling ever runs clean, which past that point
      is a driver fault rather than a latency number worth reporting.
    notes: >
      A better latency number than any single measurement, and directly
      comparable across builds -- provided the machine profile matches.

      Where JT-PCM-003 (pcm_limits.py) proves the legal period/buffer range
      and treats an xrun at the legal minimum as expected (a scheduling
      fact, not a defect), this case sweeps that same legal range -- doubling
      from the driver's minimum, period count fixed at 2 -- and finds the
      smallest size that survives repeated real transfers with zero xruns.
      Playback uses sox piped into aplay (a real tone, not /dev/zero, so a
      fast source doesn't understate how a small period gets stressed);
      capture uses arecord to /dev/null. Reports per-stream metrics plus an
      overall min_clean_period_bytes/min_clean_latency_ms taken from
      whichever stream needed the larger buffer -- the binding constraint
      for the device as a whole.

  - id: JT-PCM-008
    title: Sustained duplex playback and capture
    area: PCM
    level: L5
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/pcm.py
    args: [soak]
    # Default params run 8h; the runner's own default timeout is 3600s, so
    # without an explicit one here this aborts an hour in every time. 12h
    # leaves headroom for a slower target without needing --timeout passed
    # by hand every time (see JT-RATE-003). An explicit --timeout on the
    # command line still wins.
    timeout: 43200
    params:
      hours: 8
      rate: 44100
      report_interval_minutes: 10
    metrics:
      - xruns_playback
      - xruns_capture
      - xruns_per_hour
      - stalls_playback
      - stalls_capture
      - avail_max_playback
      - avail_max_capture
      - memory_growth_kb
      - rms_dbfs_timeline
      - capture_gaps
      - capture_gap_max_s
    pass: >
      No xrun accumulation, no capture gap longer than 30s while the
      substream reports RUNNING, no memory growth, no degradation over the
      run.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
    notes: >
      Supersedes the manual steps built from test_44100_long.sh and
      test_96000_long.sh, which timed a single playback stream and checked
      dmesg and /proc/meminfo by hand at the two ends. Automated now via
      cases/pcm.py's soak mode, which runs playback AND capture concurrently
      for the whole duration rather than playback alone -- the capture side
      is what turns "still running" into something machine-checkable: a
      stream that keeps delivering frames is audio-engine liveness, checked
      continuously rather than sampled at the end.

      The capture stream is never written to a file -- an 8-hour raw
      S24_3LE capture at 96 kHz is upward of 5 GB, and nothing here needs it
      kept. It is piped straight into the case, read and discarded in large
      chunks, with only a short RMS snapshot retained per
      report_interval_minutes. rms_dbfs_timeline is that snapshot series,
      printed live on the terminal as the case runs and kept in run.json for
      after-the-fact analysis if something looked strange partway through.
      The level is informational only, exactly as in JT-PCM-005: with
      nothing plugged into the inputs a noise floor around -90 to -110 dBFS
      is correct, and playback here is /dev/urandom on all four channels, so
      a loopback rig will read close to full scale rather than a floor.

      capture_gaps / capture_gap_max_s come from the pipe itself going quiet
      for more than 30s while /proc's substream state still reads RUNNING --
      a dead transport that an xrun count alone would not show, since an
      xrun is the ALSA core noticing, and a stalled URB stream does not
      always produce one.

      /dev/urandom rather than a file so the run is not bounded by file
      length, and so the codec sees varied data rather than a repeating
      pattern that might mask a packing error -- unchanged from the manual
      steps this replaces.

      hours defaults to 8; the runner's own --timeout (default 3600s) is
      separate and must be raised to comfortably exceed hours * 3600 when
      invoking a profile that includes this case, the same operational
      requirement JT-MIDI-007's duration_seconds overrides already carry.

      Formerly JT-SOAK-001. The SOAK area predated the L1..L5 test-level
      scheme, whose L5 (endurance/stability) already covers what SOAK was
      standing in for; each former SOAK case moved into the area it actually
      belongs to and kept its level: L5.

  - id: JT-PCM-009
    title: Xrun injection and recovery
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, root, sox]
    exec: cases/pcm_xrun_recovery.py
    args: [playback]
    params:
      rate: 48000
      seconds: 6
      injections: 3
    metrics:
      - injections_requested
      - injections_confirmed
      - xruns
      - avail_max
    pass: >
      Every injected xrun raises the substream's xrun counter, and
      aplay/arecord recovers from each one and runs to completion.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
    notes: >
      No other case in this suite produces an xrun on purpose, so
      jockey3_pcm_prepare()'s liveness check -- which ALSA core runs on
      every xrun recovery -- had no case exercising it at all. Uses
      CONFIG_SND_PCM_XRUN_DEBUG's xrun_injection proc file (root-owned,
      new jockey3-testctl verb xrun-inject) to force a real xrun on the
      open substream via snd_pcm_stop_xrun(), the same core function a
      genuine buffer underrun/overrun reaches, at chosen points during an
      otherwise ordinary playback or capture run.

      Exercises the FAST recovery path only. This driver's URBs run free
      of PCM trigger state (see jockey3.c's top-of-file DOC), so an
      ALSA-core-only xrun leaves them untouched --
      jockey3_check_urb_stream_alive() finds the stream alive immediately,
      and jockey3_pcm_prepare()'s liveness-check/recovery branch
      (JOCKEY3_STREAM_STARTUP_GRACE_MS) is never reached. There is no
      userspace-safe way to force a genuine URB-level stall on demand to
      exercise that branch too -- that class of event is covered
      statistically by rate-change soak runs instead, per
      re/rate_change_stall.md's 2026-08-27 follow-ups.

      Direction is chosen by args, playback by default -- a profile that
      also wants capture coverage overrides args: [capture] for its own
      entry, the same way JT-PCM-002/004 both point at cases/pcm.py with
      different args rather than being two separate exec files.

  - id: JT-PCM-010
    title: Packet/URB coalescing (N) validation sweep
    area: PCM
    level: L3
    mode: automated
    status: implemented
    requires: [device, root, sox]
    exec: cases/pcm_n_sweep.py
    params:
      duration_s: 10
      repeats_per_size: 3
    metrics:
      - playback_results
      - capture_results
      - playback_n_correct_count
      - capture_n_correct_count
      - playback_xrun_clean_count
      - capture_xrun_clean_count
      - playback_candidates_tested
      - capture_candidates_tested
    pass: >
      jockey3_pcm_set_n() picks the expected N at every period size on the
      ladder (landing on N=1, 2, 4 and 8; a few non-power-of-two multiples
      in between that must floor to the same values; and one control point
      above the N=8 ceiling), confirmed by reading its hw_params() dev_dbg
      line back from the kernel log. Whether the accompanying real transfer
      ran xrun-free is recorded but is NOT part of the pass criterion -- an
      xrun is a fact about this host's own USB/scheduling headroom at a
      given size, not evidence about whether the driver's N selection was
      correct.
    notes: >
      E2d (re/streaming_overhead_experiments.md) made jockey3_pcm_hw_params()
      choose the packets-per-URB count ("N") from the negotiated period size,
      and relaxed .period_bytes_min to the N=1 values (120 playback / 144
      capture). That legalized period sizes that used to sit below the
      driver's old fixed floor, and every period at or above 240 B playback /
      288 B capture now automatically gets a bigger, coalesced N where it
      always got N=1 before -- a code path no period size could reach until
      now.

      N is confirmed, not just inferred from clean playback, by turning on
      jockey3_pcm_set_n()'s dev_dbg for the run (new jockey3-testctl verb
      dyndbg-hwparams-n) and reading it back from the kernel log, bracketed
      by a pair of markers around each candidate's exact (non-rounding)
      hw_params probe. A case reading dmesg for its own targeted diagnostics
      is established practice in this suite (rate_change.py's marker-windowed
      event attribution; perf_baseline.py's direct priv.trace_callbacks_*()
      calls).

      JT-PCM-007 already runs real transfers at doubling period sizes, but
      stops at the first clean one -- the wrong shape here, since the job is
      to confirm every N the driver can choose is the RIGHT one, not just
      that the smallest usable latency exists. This case runs the same
      real-transfer method (sox/aplay, arecord, exact period/buffer
      negotiation) at every rung of the ladder, always, with no early exit --
      but the transfer's cleanliness is metrics-only now; requires: root is
      for the dyndbg toggle, not for the transfers themselves.

      The ladder is not just powers of two: 3, 5, 7 and 12 packets' worth of
      bytes are included specifically to confirm jockey3_pcm_set_n() floors
      to the nearest legal N (2, 4, 4, 8) rather than rounding up, to the
      nearest, or choosing a non-power-of-two N, which cannot exist.
      ladder=7 is the sharpest of these: it sits directly below the N=8
      boundary, so a formula that rounds to the nearest power of two instead
      of flooring would wrongly land it on N=8 too, indistinguishable from
      ladder=8 -- only a true floor produces N=4 here.

  # ------------------------------------------------------------------- RATE

  - id: JT-RATE-001
    title: Sample-rate change loop
    area: RATE
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/rate_change.py
    params:
      rates: [44100, 48000, 88200, 96000]
      # Four seconds, not one. A one-second measurement is dominated by
      # process start-up -- 0.4-0.7 s of sox, aplay and device open, measured
      # on alsa-test -- so the elapsed-time rate check cannot resolve anything
      # at that length, and a second of audio is thin evidence in its own
      # right. At four seconds the fixed cost is 10-17% against a 20%
      # tolerance, which is the point where the ratio starts to mean
      # something. Profiles that want many iterations rather than accurate
      # ones override it back down and lose the timing check, knowingly.
      seconds_per_rate: 4
      iterations_per_run: 10
      capture: true
      min_nonzero_fraction: 0.01
      rate_tolerance: 0.20
      # Wider than rate_tolerance on purpose. The capture ratio's denominator
      # is wall clock from process start, so it carries arecord start-up and
      # device open and reads 10-17% low even when the device is clocking
      # perfectly. It is now only a fallback for changes where no pointer
      # window could be measured, and only gross error is failed.
      capture_rate_gross_tolerance: 0.50
      timing_check_min_seconds: 4.0
      # The rate measurement that actually decides the verdict: the slope of
      # the device's own hw_ptr, sampled from /proc/asound while the stream
      # runs. settle_seconds is skipped after the pointer first moves, then the
      # rate is taken across the longest span of at least
      # steady_min_window_seconds in which the pointer never stops for longer
      # than plateau_seconds. Start-up, device open and every buffer in the
      # path are outside that window instead of averaged into it; buffer size
      # does not enter it at all, since a buffer shifts latency and not rate.
      #
      # 5% is the target: enough to settle "did the rate change take effect",
      # which is the only question being asked. The instrument is roughly ten
      # times better than that, and is deliberately not tightened to what it
      # can do -- at that point it would start reporting the device's crystal.
      steady_tolerance: 0.05
      settle_seconds: 0.5
      plateau_seconds: 0.15
      steady_min_window_seconds: 1.0
      pointer_poll_seconds: 0.02
      # Which stream performs the rate change, and therefore which branch of
      # jockey3_pcm_hw_params() is under test. capture -> capture_open=1, so a
      # capture stall resets on the spot. playback -> capture_open=0, so it is
      # deferred to the capture open that follows. race -> whichever process
      # won, which is what this case did before the parameter existed and is
      # kept only for reproducing older runs.
      # interleave alternates from the ends of the sorted list, which makes
      # every step large and alternating -- the shape that provokes the fault.
      # as-given uses `rates` verbatim, which is how a sweep is built to
      # separate hypotheses the default order cannot: with these four rates
      # both downward steps cross clock families and both upward steps stay
      # within one, so direction and family are perfectly correlated.
      sweep_order: interleave
      rate_change_stream: capture
      # Idle time between changes, with nothing open. Kept separate from
      # seconds_per_rate so that "the device needs recovery time between
      # changes" can be tested without also changing the length of the
      # measurement. The reset that hw_params queues is not waited for, so at
      # zero gap consecutive changes are not independent events.
      gap_seconds: 0
    metrics:
      # THE metric for milestone 13: how often a rate change costs the user an
      # audible device reset. It must trend to zero. Counted from the run
      # totals rather than the per-change attribution, so a marker that failed
      # to land cannot quietly turn it into a clean result. Its companions say
      # which way it moved -- fewer stalls, or the same stalls handled by a URB
      # restart instead of a reset, which is progress that would otherwise be
      # invisible.
      [resets_per_change_pct, resets_total_device, stalls_per_change_pct,
       urb_restarts_that_avoided_a_reset,
       stalls_capture, stalls_playback, recovery_triggered_capture,
       recovery_triggered_playback, recovery_triggered_full, urb_restart_attempt,
       capture_recovery_on_open, playback_recovery_on_prepare, restart_escalated,
       recovery_budget_exhausted,
       failures, capture_live_changes,
       capture_nodata_changes, capture_silent_changes, capture_error_changes,
       first_bad_capture_change, capture_nonzero_min, capture_nonzero_max,
       capture_effective_hz, capture_rate_ratio_min, capture_rate_ratio_max,
       playback_rate_ratio_min, playback_rate_ratio_max,
       # The rate change's own stall, told apart from the later call sites
       # that share its message. This is the incidence figure.
       capture_stall_hw_params_total, capture_stall_on_open_total,
       capture_stall_after_urb_restart_total, capture_stall_after_reset_total,
       # All three end in usb_queue_reset_device(); what differs is only
       # which light retry (from which call site) failed first, never how
       # big the reset is.
       reset_on_rate_change_total, reset_after_urb_restart_total,
       reset_after_playback_prepare_total,
       stalled_after_full_reset_total, reset_timeout_total,
       # Which recovery path each change actually took, counted over the run.
       branch_reset, branch_recovered_on_open, branch_deferred, branch_clean,
       # Incidence grouped the three ways open question 2 of
       # re/rate_change_stall.md asks for.
       stalls_direction_up, stalls_direction_down, stalls_direction_first,
       stalls_family_cross, stalls_family_within,
       rate_change_stream, gap_seconds, lead_stream_configure_timeouts,
       # The steady-state clock measurement, and the start-up cost it excludes.
       steady_ratio_playback_min, steady_ratio_playback_max,
       steady_ratio_capture_min, steady_ratio_capture_max,
       steady_error_playback_pct, steady_error_capture_pct,
       steady_unmeasured_playback, steady_unmeasured_capture,
       startup_s_playback_min, startup_s_playback_max,
       startup_s_capture_min, startup_s_capture_max,
       # A pointer that stops and resumes is a stall seen from the host, at the
       # poll interval rather than at the watchdog's one second.
       pointer_plateau_changes_playback, pointer_plateau_changes_capture,
       pointer_quantum_max, xruns,
       buffer_size_playback, period_size_playback,
       buffer_size_capture, period_size_capture,
       # Set when the sweep gave up early because the card did not come back
       # within device_wait_seconds -- see alsa.wait_for_card_live(). A short
       # run under this is a real fail, not merely fewer changes than asked.
       aborted_device_unavailable]
    pass: >
      Every rate change ends with working streams in BOTH directions. A stall
      that recovers is a PASS and is counted; a stall that survives a full USB
      reset is a FAIL, and so is a capture that comes back bit-exact silent.

      resets_per_change_pct is not part of the pass criterion and deliberately
      so -- a threshold would have to be picked, and any value above zero would
      bless the fault. It is the number the driver is judged on over time
      instead: it must trend to zero, and a build where it has not moved has
      survived the fault rather than fixed it. The case prints it at the end of
      every run for that reason.

      Capture is judged exactly as in JT-AUDIO-005: a running converter carries
      a noise floor whether or not anything is patched in, so an all-zero
      capture is an engine that never restarted, not a quiet input. The floor
      is 1% of frames non-zero, against >95% observed when healthy.

      Recording also matters for what it makes the DRIVER do: with a capture
      stream open, jockey3_pcm_hw_params() recovers a capture stall itself
      instead of deferring it, which is the path that carries the risk and was
      untested while this case only played.

      The rate itself is checked against the clock, not against the device.
      This is independent of what GET_RATE reports, which only proves the
      firmware accepted the value into a register -- exactly the gap in which
      this device's known faults live, where every return code is correct and
      the stream is not.

      It is measured from hw_ptr, the device's own frame counter, sampled from
      /proc/asound while the stream runs, and taken in steady state: after
      settle_seconds, across the longest plateau-free span, in BOTH directions.
      Either direction outside steady_tolerance fails. Timing a whole aplay or
      arecord invocation instead -- which is what this case used to do -- gives
      rate / (1 + startup/duration) and reads 10-17% low at four seconds even
      when the device is perfect; the excluded cost is now measured and
      reported as startup_s_*, rather than charged to the sample rate. Buffer
      size does not enter the measurement: a buffer shifts latency, not rate.

      A pointer that stops and later resumes is a STALL, reported as such with
      its onset and duration, and the rate is measured around it rather than
      through it. Averaging a stall into the rate would report the fault this
      driver has as the fault it does not, in the same bucket.

      The elapsed-time ratios are still recorded as cross-checks, and are all
      that is left where no pointer window could be measured; there they are
      judged only against capture_rate_gross_tolerance.

      Which branch was under test is part of the result. rate_change_stream
      fixes whether hw_params sees capture_open=1 (recovers on the spot,
      light URB restart first) or 0 (defer to the next capture open);
      branch_change_* records what each
      change actually did, so a run that drifted onto the other branch is
      visible rather than assumed away. Two runs may only be compared as
      measurements of the same quantity if they used the same arm -- and a
      capture:false run is never such a measurement: with nothing to recover a
      deferred stall, capture stays dead and hw_params re-logs the stall at
      every later change, so its count is one outage re-detected, not
      per-change incidence.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
      - 'Rate change to \d+ Hz left a stream stalled'
      - 'Capture stream stalled \(opening a capture stream\)'
      - 'Playback stream stalled \(preparing a playback stream\)'
      - '(?:Playback|Capture) stream stalled \(a rate change\)'
    notes: >
      THE most important case in this catalog, and the one with the least
      obvious criterion. Capture stall after a rate change is expected on a
      healthy build -- the driver logs it deliberately so frequency can be
      tracked. "No warnings" would fail every run on a perfectly good driver.
      Worst case is a downward switch, so the rate list should not be sorted.

      The parameter sweeps this case exists to serve are run with --param
      rather than by editing the values above, e.g.

        ./runner.py --case JT-RATE-001 --unattended \
            --param rate_change_stream=playback --param gap_seconds=3

      run.json records the resolved parameters, so every arm identifies itself.

      No reset_wait_ms metric is listed: the message lib/rules.yaml looks for,
      "waited N ms for reset completion", is not in the driver.
      jockey3_wait_for_reset_completion() logs only a dev_dbg on entry and a
      dev_warn on timeout, so the reset duration is not currently observable
      from the log at all. See re/rate_change_stall.md.

  - id: JT-RATE-002
    title: Sample-rate change under full duplex
    area: RATE
    level: L3
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/rate_change_duplex.py
    params:
      rate_a: 44100
      rate_b: 96000
      settle_seconds: 1
      same_rate_seconds: 2
      diff_rate_seconds: 2
      after_capture_seconds: 4
      min_nonzero_fraction: 0.01
    metrics: [failures, same_rate_open_s, diff_rate_attempt_s,
              diff_rate_obtained_hz, stalls_playback, stalls_capture,
              recovery_triggered_capture, recovery_triggered_full]
    pass: >
      A second stream at the same rate is accepted. A second stream at a
      different rate is constrained to the rate already running -- checked
      by the negotiated rate actually read back from /proc, not by an
      expectation that it gets refused outright -- without the driver's own
      -EBUSY check firing. After both close, a rate change works and any
      capture stall recovers.
    notes: >
      CORRECTED 2026-08-18 after a hardware run (x86_64-prod
      20260818T141039Z-smoke) failed on a wrong assumption: the automated
      case originally expected the different-rate playback to be refused
      outright and fast. It is not -- aplay calls
      snd_pcm_hw_params_set_rate_near(), which is satisfied by the nearest
      legal rate, and the driver's constraint set has exactly one, so the
      request is silently coerced to the existing rate rather than
      rejected. See diff_rate_playback() in the case script for the fix:
      it reads the negotiated rate back from /proc instead of trusting
      aplay's exit code or stderr text.

      AUTOMATED 2026-08-18 as cases/rate_change_duplex.py, replacing the
      manual steps below with the same sequence. The different-rate refusal
      is checked by exit code AND elapsed time, not exit code alone: aplay
      exits non-zero for reasons that have nothing to do with the rate
      constraint (missing device, busy node, bad format), so only a FAST
      refusal is accepted as evidence the ALSA-core constraint fired rather
      than a real device fault.

      REWRITTEN 2026-08-10 after an operator marked the previous version
      invalid, which it was. It said to hold capture open at 44100 and sweep
      the playback rate. That cannot happen: jockey3_pcm_open() applies
      snd_pcm_hw_constraint_single(RATE, current_rate) while another stream is
      open, so the ALSA core refuses the second stream at any other rate
      before the driver is ever consulted. The device has one global rate.

      What is left is worth testing, and is what the case now does: that the
      constraint is real and enforced in the right place. The driver also
      carries its own -EBUSY sanity check for more than one active stream, and
      that message appearing would mean the constraint had failed first --
      which is why its ABSENCE is a step.

      Note this no longer reaches a "capture stall while playback changes
      rate" case, because that state is unreachable by construction. The
      direction-aware recovery is exercised where it actually occurs: capture's
      own hw_params, which JT-PCM-004 already records as
      capture_recovery_on_open.

      The predecessor scripts-alsa-dev/test_rate_change_fdx.sh should be read
      with the same suspicion before being trusted.

  - id: JT-RATE-003
    title: Rate change endurance
    area: RATE
    level: L5
    mode: automated
    status: implemented
    requires: [device, sox]
    exec: cases/rate_change.py
    # ~8h measured for the default 5000 iterations on a fast x86_64 box;
    # 12h leaves headroom for a slower target without needing --timeout
    # passed by hand every time (see the `soak` profile notes in
    # profiles.yaml). An explicit --timeout on the command line still wins.
    timeout: 43200
    params:
      # Same case as JT-RATE-001, run long instead of accurate: no
      # seconds_per_rate override, so it keeps the script's 1 s default
      # rather than JT-RATE-001's 4 s. At 5000 iterations x 4 rates that is
      # already the historical ~10 hour mileage; spending 4 s per change on
      # top would take this past a day for no endurance benefit. The
      # steady-state pointer measurement still runs at 1 s -- it just
      # resolves fewer of the changes, which is recorded as
      # steady_unmeasured_* rather than failed. rate_change_stream is left at
      # the script default (capture), so a JT-RATE-003 run is directly
      # comparable to a default JT-RATE-001 run on resets_per_change_pct.
      iterations_per_run: 5000
    metrics:
      # Identical to JT-RATE-001's list, on purpose: the whole point of this
      # case is that resets_per_change_pct and its companions are the SAME
      # measurement taken long instead of short, so a drift between the two
      # is visible as a difference rather than as two incomparable numbers.
      [resets_per_change_pct, resets_total_device, stalls_per_change_pct,
       urb_restarts_that_avoided_a_reset,
       stalls_capture, stalls_playback, recovery_triggered_capture,
       recovery_triggered_playback, recovery_triggered_full, urb_restart_attempt,
       capture_recovery_on_open, playback_recovery_on_prepare, restart_escalated,
       recovery_budget_exhausted,
       failures, capture_live_changes,
       capture_nodata_changes, capture_silent_changes, capture_error_changes,
       first_bad_capture_change, capture_nonzero_min, capture_nonzero_max,
       capture_effective_hz, capture_rate_ratio_min, capture_rate_ratio_max,
       playback_rate_ratio_min, playback_rate_ratio_max,
       capture_stall_hw_params_total, capture_stall_on_open_total,
       capture_stall_after_urb_restart_total, capture_stall_after_reset_total,
       reset_on_rate_change_total, reset_after_urb_restart_total,
       reset_after_playback_prepare_total,
       stalled_after_full_reset_total, reset_timeout_total,
       branch_reset, branch_recovered_on_open, branch_deferred, branch_clean,
       stalls_direction_up, stalls_direction_down, stalls_direction_first,
       stalls_family_cross, stalls_family_within,
       rate_change_stream, gap_seconds, lead_stream_configure_timeouts,
       steady_ratio_playback_min, steady_ratio_playback_max,
       steady_ratio_capture_min, steady_ratio_capture_max,
       steady_error_playback_pct, steady_error_capture_pct,
       steady_unmeasured_playback, steady_unmeasured_capture,
       startup_s_playback_min, startup_s_playback_max,
       startup_s_capture_min, startup_s_capture_max,
       pointer_plateau_changes_playback, pointer_plateau_changes_capture,
       pointer_quantum_max, xruns,
       buffer_size_playback, period_size_playback,
       buffer_size_capture, period_size_capture,
       # Set when the sweep gave up early because the card did not come back
       # within device_wait_seconds -- see alsa.wait_for_card_live(). A short
       # run under this is a real fail, not merely fewer changes than asked.
       aborted_device_unavailable]
    pass: >
      Same per-change criterion as JT-RATE-001 -- a stall that recovers is a
      pass, a stall that survives a full USB reset or a capture that comes
      back bit-exact silent is a fail -- run over thousands of changes instead
      of ten. What this case exists to answer is not "does it pass" but "does
      resets_per_change_pct drift": ledger.py trends it per target, and a
      build where the short JT-RATE-001 number looks fine but this one climbs
      has not fixed Milestone 13's fault, only kept it below the noise floor
      of a short run.
    expect_dmesg:
      - 'Playback URB has stalled\.'
      - 'Capture URB has stalled\.'
      - 'Rate change to \d+ Hz left a stream stalled'
      - 'Capture stream stalled \(opening a capture stream\)'
      - 'Playback stream stalled \(preparing a playback stream\)'
      - '(?:Playback|Capture) stream stalled \(a rate change\)'
    notes: >
      The long-running version of JT-RATE-001, historically run for ten hours
      at a time -- same script (cases/rate_change.py), same metrics, same
      pass criterion, only iterations_per_run differs. See JT-RATE-001 for
      why the criterion is "stalled and recovered = pass" rather than
      "no stall", and re/rate_change_stall.md for the working notes this case
      was written to serve.

      resets_per_change_pct is the same headline figure JT-RATE-001 prints, and
      is what makes the two comparable: a short run and a ten-hour one both
      answer "how often does a rate change cost a device reset", so a rate that
      is good in the small and bad in the large is visible as a difference
      between them rather than as two incomparable numbers.

      Run with --timeout comfortably above the expected duration, same as any
      other soak-profile case -- runner.py's default is 3600s and this case is
      designed to run far longer than that.

      KNOWN DEGRADATION on a long run: attribution is read from ONE
      kmsg.read_log() call after the last change, and the kernel ring buffer
      is finite while this run is not. At thousands of changes x two markers
      each, plus every stall/reset line, a long run can outlast the buffer,
      and the early part of the log -- including some of the markers this
      depends on -- can already be gone by the time it is read.

      That degrades visibly rather than silently: markers_found_in_log vs
      markers_written, and attribution_trustworthy, say so, and per-change
      figures (branch_change_*, stalls_direction_*, etc.) are suppressed
      rather than shown wrong when it happens. The RUN-TOTAL figures --
      resets_per_change_pct, stalls_per_change_pct and their *_total
      companions -- are NOT suppressed and remain the pass/fail and trend
      metrics, but on a wrapped run they become a LOWER bound: events that
      scrolled out of the buffer before the read are undercounted, never
      double-counted, so a wrapped run can only ever read better than it
      actually was. A continuous-capture fix (following the log as it is
      written, rather than reading it once at the end) would remove this
      bound; it was scoped out here as a larger change than this case's
      wiring, deliberately, rather than risk a fix that double-counts
      instead -- see re/rate_change_stall.md.

  - id: JT-RATE-004
    title: Rate change while the device is being removed
    area: RATE
    level: L3
    mode: automated
    status: implemented
    requires: [device, root, usb-power, sox]
    exec: cases/rate_change_power_loss.py
    params:
      iterations_per_run: 6
      rates: [44100, 48000, 96000]
      seconds: 2
      off_seconds: 2
      settle_seconds: 8
      race_ms_min: 20
      race_ms_max: 120
    metrics: [cycles, reopen_attempts, enumerate_ms, card_index_first, card_index_last]
    pass: >
      The device re-enumerates after every cycle with all three substream types,
      and a rate change still works afterwards. No submit failure and no
      "Endpoints are disabled" anywhere in the log -- both are driver_fail in
      lib/rules.yaml, so the runner enforces that part, not the case. How often
      a rate change actually raced a removal is the "rate_change_raced_removal"
      metric lib/rules.yaml attaches to "Failed to initialize device to change
      rate: -19", not a metric this case computes itself.
    expect_dmesg:
      - 'Firmware version read failed'
      - 'URB stream stalled: no completion for'
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Start a rate change and pull the cable roughly a tenth of a second
        later: aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 96000 /dev/urandom
      - Plug it back in and wait for the card to reappear.
      - >
        Confirm dmesg contains NO "Failed to submit ... URB: -2" and no
        "Endpoints are disabled after ...". A -110 from "Failed to initialize
        device to change rate" is acceptable; -2 on submit is not.
      - >
        Confirm a rate change still works:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 44100 -d 2 /dev/urandom
      - Repeat a few times.
    notes: >
      Regression cover for the 2026-08-11 -ENOENT cascade. usb_set_interface()
      disables an interface's endpoints as its first action and does not
      re-enable them when SET_INTERFACE fails, so a rate change against a device
      that has stopped answering EP0 left interface 0 permanently dead --
      EP 0x05 and EP 0x83 returning -2 on every submit while interface 1, never
      reached, kept working. That asymmetry is what identified the mechanism.

      This case CANNOT reproduce the original wedge, which needs a device that
      is still enumerated but silent. It reaches the same code path the only way
      a machine can on demand: the window between VBUS dropping and the kernel
      marking the device NOTATTACHED, in which a control transfer is submitted
      and never completes.

      The window is narrow and not under our control, so how often it was hit
      is recorded rather than asserted -- see the "rate_change_raced_removal"
      metric lib/rules.yaml attaches to the driver's own -19 log lines. A run
      of zeroes means nothing was provoked, which is different from a clean
      pass and must not read as one.

  # ------------------------------------------------------------------ AUDIO

  - id: JT-AUDIO-001
    title: Channel map sweep -- each output in turn
    area: AUDIO
    level: L3
    mode: manual
    status: implemented
    requires: [device, speakers, human]
    params:
      rates: [44100, 48000, 88200, 96000]
    pass: >
      Each of the four playback channels produces a tone from the correct
      physical output, at the correct pitch, one at a time.
    steps:
      - Run actions/play_channel_sweep.sh <rate>.
      - >
        Confirm four tones in order: Master L (E3), Master R (A3),
        Headphone L (D4), Headphone R (G4).
      - Confirm each sounds from one output only, and at the expected pitch.
      - Repeat for each rate under test.
    notes: >
      Pitch matters as much as presence: a wrong pitch at the right channel
      means the rate was not actually applied. From the test_channels_*.sh
      family.

  - id: JT-AUDIO-002
    title: Output presence and channel map via loopback
    area: AUDIO
    level: L3
    mode: automated
    status: implemented
    requires: [device, loopback-cable]
    exec: cases/audio_loopback.py
    params:
      rates: [44100, 48000, 88200, 96000]
      seconds: 3
    metrics: [channel_map_ok, isolation_db, snr_db, floor_dbfs, clip_fraction,
              rms_dbfs, xruns_playback, xruns_capture]
    pass: >
      For each patched output/input pair, whichever of the four known tones
      is loudest on a capture channel is the one that output actually sent
      -- a same-capture ranking, not an absolute level, so it does not
      depend on the input's analog gain. Gated on that channel's own
      measured noise floor clearing snr_min_db (default 40 dB), so a dead
      or disconnected channel reads as inconclusive rather than a false
      pass or fail.
    notes: >
      Uses the device's own I/O -- Master out into In 1, Headphone out into
      In 2 -- so no second sound card is needed, but only pairs that are
      actually cabled on this bench are checked: which output is patched to
      which input is machine-local config
      (audio_loopback.patches in ~/.config/jockey3/machine.yaml), not
      assumed. A pair with no cable is reported as untested, not failed.

      Deliberately NOT an RMS threshold. Measured absolute level depends on
      the input's analog gain/volume trim, which this case has no way to
      read, so a fixed dBFS gate would fail a healthy device on a low trim
      or pass a broken one on a hot trim. Every verdict here is a ratio
      measured within one capture (a tone against the other known tones, a
      tone against that channel's own measured noise floor), which cancels
      a shared gain out. rms_dbfs is still recorded, informational only,
      same as JT-PCM-005.

      The floor is a real capture, not a proxy: a short recording with
      nothing playing, taken once per rate right before the tones. A
      healthy input is expected around -80 dBFS (Frank, 2026-08-19); a
      floor well above that is noted (possible hum, ground loop, or wrong
      input mode) without gating the verdict. Keeping snr_min_db at 40 dB
      means the tones do not need to run hot to clear it, which matters
      because Master/Headphone may have real speakers or headphones
      connected for the duration of this case.

      One tone per playback channel (E3/A3/D4/G4, same as JT-AUDIO-001),
      read out with a Goertzel bin per tone rather than a deterministic
      counter pattern and cross-correlation: the round trip is analog, so
      this case cannot prove bit-exact data integrity either way, and a
      frequency-domain read needs no alignment between the independent aplay
      and arecord processes, unlike a correlation lag search. Data integrity
      stays an open finding -- see docs/test_strategy.md section 12.

      A channel whose loudest tone does not clear its own measured floor by
      snr_min_db is reported inconclusive rather than failed -- a
      disconnected cable and a real driver defect read the same way there,
      and only someone at the bench can tell them apart. The gate looks at
      whichever tone is loudest, not specifically the expected one, so a
      full channel-map swap (a strong, wrong tone present) is still scored
      as a channel-map failure rather than misread as a dead channel. A
      channel with more than a trace of clipping is flagged too: clipping's
      harmonics can spill into a neighboring bin and manufacture a spurious
      channel-map or crosstalk finding that has nothing to do with the
      driver.

  - id: JT-AUDIO-003
    title: Real content playback, listened to
    area: AUDIO
    level: L3
    mode: manual
    status: implemented
    requires: [device, speakers, human]
    pass: >
      Music plays cleanly: no clicks, dropouts, distortion, or channel
      swapping, at each rate tried.
    steps:
      - Play a known-good FLAC or WAV to the device (actions/play_file.sh).
      - Listen on Master and on Headphones.
      - Note anything audible, however minor, in the comment field.
    notes: >
      The only test that can catch codec packing errors as they actually
      manifest. Worth doing at 44.1 and 96 kHz at minimum.

      Disabled on the debug targets, and that is not caution. Measured
      2026-08-09: the same file crackles audibly on x86_64-debug and plays
      cleanly on x86_64-prod, with xrun_counter zero and avail_max around 5500
      on both -- so ALSA is comfortable either way and the gap is downstream of
      it, in URBs resubmitted late under KASAN. Asking "did it sound clean?"
      there records a fail against the driver for the kernel's overhead.

      If this fails on a PRODUCTION kernel, that reasoning does not apply and
      it is a real defect. Check xrun_counter and avail_max first; if both are
      clean, the cause is past where /proc/asound can see and the next step is
      a wire-level trace -- see docs/test_strategy.md section 11a and
      re/usb/openvizsla/README.md. Play from a decoded file rather than a
      sox pipe before concluding anything, so userspace is out of the path.

  - id: JT-AUDIO-004
    title: Real content recording, listened to
    area: AUDIO
    level: L3
    mode: manual
    status: implemented
    requires: [device, signal-source, human]
    pass: >
      Each input records cleanly: no clicks, dropouts, distortion, or channel
      swapping, at each rate tried, and the channel carrying the fed source
      is the one that actually has content.
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Feed a known source into Line 1 (e.g. a phone or player at line
        level) and record 60 s:
        arecord -vv -D hw:$CARD -d 60 -f S24_3LE -c 6 -r 96000 -t wav > line1_96k.wav
      - Repeat into Line 2, into its own file.
      - Repeat with the microphone -- speak or play something near it.
      - Listen to each recording. Note anything audible, however minor.
      - >
        For each, confirm the channel(s) carrying the fed source are the
        ones that actually have content -- catches a channel swap that RMS
        presence alone cannot tell apart from a healthy recording on the
        wrong channel.
    notes: >
      REPLACES the earlier "Capture signal presence" plan (never
      implemented, semi-automated, RMS-per-channel only): a channel is not
      dead is not the same claim as what it carries is clean, and capture is
      exactly where JT-AUDIO-003's own reasoning about codec packing errors
      applies symmetrically. Paired with JT-AUDIO-003, this puts a human ear
      in the loop for both playback and capture, not playback alone.

      In1 L/R, In2 L/R and the microphone, which is mono duplicated across
      channels 5 and 6. Mic level is known to be lower than under Windows --
      Windows applies software gain -- so a quiet mic channel is not by
      itself a defect.

      Worth doing at 44.1 and 96 kHz at minimum, same as JT-AUDIO-003. Same
      caution applies on a KASAN kernel too -- see JT-AUDIO-003's notes on
      why a debug-kernel crackle is not a driver defect.

  - id: JT-AUDIO-005
    title: Device audio engine starts after a power cycle
    area: AUDIO
    level: L3
    # Automated, not semi-automated, and the distinction is load-bearing: mode
    # semi-automated makes the runner derive a need for `human`, which would
    # withhold this case from exactly the unattended runs the mains switch
    # exists to enable. That derivation guards cases that ASK something and
    # would hang waiting for an answer. This one only ever instructs, never
    # blocks on input, and takes the bus as its witness either way -- so with
    # device-power it needs nobody. Without it, the case says so and blocks,
    # and the steps below are how a person does it instead.
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/audio_engine_start.py
    params:
      trigger: device_power
      iterations_per_run: 10
      off_seconds: 5
      seconds: 2
      rate: 44100
      min_nonzero_fraction: 0.01
      operator_timeout_seconds: 120
    metrics: [cycles, silent_cycles, first_silent_cycle, nonzero_fraction_min,
              nonzero_fraction_max, enumerate_ms_max, trigger]
    pass: >
      Every power cycle leaves a device that actually produces audio. Capture
      carries a noise floor -- a running converter is never bit-exact silent,
      and the working runs measure above 95% of frames non-zero. A capture
      that is entirely zero means the device accepted the stream and never
      started its audio engine, which no dmesg line and no xrun counter
      reports.
    notes: >
      Observed 2026-08-13 on the production kernel: three consecutive power
      cycles produced a device that enumerated, probed, programmed and
      verified its rate, and accepted every playback sample while emitting
      nothing. The control plane was byte-identical to the cycle that worked.

      Needs a real device power cycle. Ten re-enumerations through the ppps
      hub switch all recovered correctly -- the Jockey 3 is self-powered, so
      cutting VBUS is a cable unplug rather than a power-off, and the two are
      not equivalent to the device.

      It therefore switches the device's own mains supply: a network relay
      when one is configured (device-power, see lib/power/), otherwise an
      operator working the switch by hand. With a relay it runs unattended,
      which is what makes a fault this intermittent practical to chase. The
      case blocks itself if neither is available, which is why device-power
      and human are not listed as requirements -- either will do.

      Set trigger:usb_power for the automated regression baseline, or
      trigger:module_reload to re-probe a device that stayed powered.
    expect_dmesg:
      # Single backslashes. YAML single-quoting has no escape sequences, so
      # '\\d' reaches re as a literal backslash followed by 'd' and matches
      # nothing -- which is how 'callbacks suppressed' sat in the unclassified
      # bucket of every run this case ever produced, including the baseline.
      #
      # MIDI IN belongs in the "stopped after" alternation alongside Playback
      # and Capture: cutting the mains kills all three streams, and the MIDI
      # line is not covered by the benign rule in lib/rules.yaml because that
      # one anchors on "; deferring recovery", which only Playback and Capture
      # emit.
      - 'jockey3_urb_error_give_up: \d+ callbacks suppressed$'
      - '(?:Playback|Capture|MIDI IN) URB error: -71'
      - '(?:Playback|Capture|MIDI IN) stopped after \d+ consecutive URB errors'
      - 'Failed to resubmit MIDI IN URB: -19$'
    steps:
      - >
        Switch the device off, wait for the LEDs to go dark, and switch it
        back on. Wait for the card to reappear in /proc/asound/cards.
      - >
        Capture two seconds from it, for example
        `arecord -D hw:CARD -f S24_3LE -c 6 -r 44100 -d 2 -t raw /tmp/e.raw`.
      - >
        Check whether any byte of that capture is non-zero, e.g.
        `python3 -c "print(any(open('/tmp/e.raw','rb').read()))"`. True is a
        pass. False means the device never started its audio engine, even
        though playback was accepted and dmesg is clean.
      - >
        Repeat ten times. The fault is intermittent -- three failures in four
        cycles were seen on 2026-08-13, and a single passing cycle proves
        nothing.
      - >
        If a cycle fails, keep the capture and take an OpenVizsla trace of the
        next attempt; see re/usb/init_timing_comparison.md.

  # ------------------------------------------------------------------- MIDI

  - id: JT-MIDI-001
    title: Control surface events reach userspace
    area: MIDI
    level: L3
    mode: semi-automated
    status: implemented
    requires: [device, python-mido]
    exec: cases/midi_controls.py
    params:
      watch_seconds: 30
      button_events: 5
      continuous_events: 20
      answer_timeout: 120
    metrics: [button_events, continuous_events]
    pass: >
      Button presses, fader and knob movements, and jog wheel rotation all
      produce MIDI events.
    steps:
      - Run scripts-alsa-dev/miditest/miditest.py and press 'd' for hexdump.
      - Press several buttons; confirm note events appear.
      - >
        Move a fader or knob, and rotate a jog wheel; confirm a stream of
        events appears. Which control produced them does not matter -- the
        driver's code path does not know, so any swept control proves the
        same thing.
    notes: >
      Verifying every individual control is out of scope -- that tests Reloop's
      firmware. If the driver delivers one button and one jog movement it
      delivers all of them; the code path does not know which control moved.

  - id: JT-MIDI-002
    title: LEDs respond to MIDI OUT
    area: MIDI
    level: L3
    mode: semi-automated
    status: implemented
    requires: [device]
    exec: cases/midi_leds.py
    params:
      repeats: 3
      interval_seconds: 0.2
      countdown_seconds: 3
      answer_timeout: 120
    metrics: [write_failures, leds_seen]
    pass: The commanded LEDs light, and the startup attract pattern stops.
    steps:
      - Run actions/blink_leds.sh.
      - Confirm the expected LEDs blink.
      - Confirm the device's attract-mode animation has stopped.
    notes: >
      Attract mode stops only after the first MIDI OUT message, so it doubles
      as confirmation that MIDI OUT reached the device at all.

  - id: JT-MIDI-004
    title: MIDI OUT throughput at each sample rate
    area: MIDI
    level: L3
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/midi.py
    params:
      rates: [44100, 48000, 88200, 96000]
      duration_seconds: 30
      tolerance: 0.05
    metrics: [achieved_bps, write_failures, urb_stalls_playback, rates_tested]
    pass: >
      At every rate, achieved MIDI OUT throughput holds within +/-5% of the
      driver's 2500 B/s ceiling, no MIDI OUT write fails, and no playback URB
      stall goes unended.
    notes: >
      jockey3_get_next_midi_out_byte() paces via
      midi_out_acc += 2500; emit when midi_out_acc >= midi_rate_divisor, where
      midi_rate_divisor = rate / PLOYTEC_PLAYBACK_FRAMES is recomputed on
      every rate change. PLOYTEC_PLAYBACK_FRAMES is 10, which divides all
      four supported rates exactly, so the divisor itself carries no
      truncation bias; working through the algebra, the achieved byte rate
      this produces is ~2500 B/s at every sample rate -- the divisor scaling
      exists to cancel the rate-dependent URB completion frequency, not to
      make the target itself rate-dependent. Lowered from 3125 on 2026-08-19
      after hardware testing found the control surface becoming unresponsive
      well under the raw MIDI line rate -- see re/playback_stall_wedge.md.

      A first hardware run (2026-08-16) using a paced amidi(1)-per-burst
      design read ~59% of the intended target at every rate uniformly -- the
      signature of the test script's own per-process-spawn overhead, not a
      driver effect, since a real per-rate arithmetic bug would not land on
      the same fraction at every rate. The case was rewritten to write the
      rawmidi device node directly (no subprocess per chunk) and measure
      whatever rate the kernel's own backpressure settles at.

      That rewrite's first clean measurement (x86_64-prod, 2026-08-16): 3122
      / 3120 / 3121 / 3120 B/s at 44.1 / 48 / 88.2 / 96 kHz -- flat across
      rates to within 0.1% and within 0.2% of the 3125 constant, confirming
      the exact-division algebra above. An earlier manual figure (2906 B/s at
      44.1 kHz, 3188 B/s at 96 kHz, from the interactive miditest.py) is not
      a counter-measurement to weigh against this one: that tool finds the
      ceiling by ear/eye, nudging its send rate up and down in 10% steps
      while watching /proc's rawmidi buffer occupancy for the first sign of
      backup, a methodology built for "close enough to play with", not to
      resolve the ceiling tighter than roughly that 10% step plus human
      reaction time. The 5% tolerance here leaves ~25x margin over the 0.2%
      deviation actually observed, room for run-to-run and machine-to-machine
      jitter without losing the ability to catch a real regression.

      Shares cases/midi.py's burst loop and stall accounting with JT-MIDI-007
      rather than a separate script -- see that file's module docstring for
      why one file covers both. This case sets the `rates` param, which
      switches the script from JT-MIDI-007's single-rate, deliberately
      throttled endurance mode to priming each rate in turn (a few seconds of
      silent PCM playback, to drive jockey3_pcm_hw_params() through the
      change and let the new midi_rate_divisor take effect) and measuring an
      unthrottled window at each.

      Formerly paired with JT-MIDI-003 ("MIDI flood throughput"), which was
      retired: its below-the-ceiling territory was a strict subset of what
      JT-MIDI-007 already records at load_fraction 0.9, and its
      above-the-ceiling territory (deliberately overdriving the limiter)
      cannot be done safely -- MIDI OUT rides in every playback packet, so
      overdriving backs up the rawmidi buffer and risks the ALSA drain
      timeout that lib/rules.yaml classifies as a driver_fail, on a
      perfectly healthy device. JT-MIDI-007's own docstring paces under the
      ceiling for exactly this reason.

  - id: JT-MIDI-005
    title: Firmware padding bytes are stripped from MIDI IN
    area: MIDI
    level: L3
    mode: semi-automated
    status: implemented
    requires: [device]
    exec: cases/midi_padding.py
    params:
      watch_seconds: 60
    metrics: [bytes_seen, padding_bytes_seen]
    pass: No byte >= 0xF0 reaches the rawmidi stream while the operator drives it.
    steps:
      - 'Resolve the port: amidi -l | grep RJ3'
      - 'Dump raw bytes for a minute: amidi -p <port> -d & sleep 60; kill %1'
      - >
        While it runs, press several buttons, move a fader or knob, and
        rotate a jog wheel -- keep generating traffic for the full minute.
      - >
        In the dump, confirm every byte is either a data byte (< 0x80) or a
        status byte below 0xF0. Any byte 0xF0-0xFF is unstripped firmware
        padding.
    notes: >
      CHANGED FROM planned/automated 2026-08-18: an automated form (feed
      synthetic padded frames some other way and check the output) cannot
      exercise the actual code path this exists to catch a regression in --
      jockey3_midi_in_callback()'s in-place compaction runs on whatever the
      firmware's own URBs contain, and there is no way to make the firmware
      emit specific padding on demand. So a human drives real control
      surface traffic instead, same division of labor as JT-MIDI-001
      (machine is the judge, human is the actuator) -- but with a
      purely time-based exit condition and no minimum event count, since
      this case's question ("did anything unexpected also arrive") has
      nothing to do with how much good traffic arrived. See the case
      script's own docstring for why this could not simply run as an
      add-on check inside JT-MIDI-001 itself.

      The strip loop in jockey3_midi_in_callback() drops any byte >= 0xF0,
      not just the System Real-Time range (0xF8-0xFF) this case's title
      names -- the device sends no MIDI System or Real-Time messages at
      all, so the driver treats the whole 0xF0-0xFF range as padding. The
      pass criterion above reflects that; the title is legacy naming.

      Different firmware revisions emit different padding (0xF9, 0xFB, 0xFD,
      0xFF have all been observed). One unit only proves the strip loop
      works for whichever value it emits; running this case again on a
      second unit, cable swapped, is worth more than repeating it on the
      same one -- but is not required for a useful run, so `two-devices`
      is not in `requires`.

  - id: JT-MIDI-006
    title: KUnit suite for MIDI 1.0 Running Status expansion
    area: MIDI
    level: L2
    mode: automated
    status: implemented
    requires: [kernel-tree]
    exec: cases/midi_kunit.py
    args: [um]
    metrics: [tests_run, tests_passed]
    pass: All tests pass.
    notes: >
      Proves ploytec_midi_running_status_expand() correct in isolation, no
      device needed: a random Channel Voice / System Common / Real-Time
      message stream is compressed to Running Status, expanded back out
      through the function plus its documented queued-byte drain contract,
      and an independent parser checks the message sequence round-trips and
      that no Channel Voice message in the output is left without an
      explicit status byte. Carved out of JT-MIDI-003, whose "correctly
      expanded" objective depended on human observation of LED response and
      could not be automated; the rate-limiter interaction and actual URB
      delivery remain outside this suite's scope.

  - id: JT-MIDI-007
    title: Sustained MIDI OUT, watched for a URB stall
    area: MIDI
    level: L5
    mode: automated
    status: implemented
    requires: [device]
    exec: cases/midi.py
    params:
      duration_seconds: 1800
      load_fraction: 0.9
      messages_per_burst: 8
      check_interval_seconds: 30
      progress_interval_seconds: 60
    metrics:
      [elapsed_seconds, bytes_sent, bursts, write_failures, achieved_bps,
       urb_stalls_playback, urb_stalls_capture, urb_stall_onset_ms,
       urb_stall_recovered_ms, urb_stall_restarted_ms]
    pass: >
      Every MIDI OUT write is accepted, the card is still present with all three
      substream types at the end, and every PLAYBACK URB stall that started
      during the soak also ended -- by recovering, or by a URB restart, which is
      how nearly all of them end. A stall that outlives the watchdog's
      one-minute heartbeat is failed by the runner from lib/rules.yaml; the case
      pairs onsets against endings itself as well, because the heartbeat needs
      the watchdog to still be ticking a minute later and a wedge near the end
      of the soak, or one the device does not survive, never gets there.

      Capture is counted but not asserted on. A capture stall while nothing is
      recording is deferred by design to the next capture open, which this case
      never performs, so it stays legitimately unended for the whole soak.
      Playback is never deferred -- it carries MIDI OUT -- so it is the
      direction a wedge shows up in, and it is what died on 2026-08-11.
    notes: >
      Hunting the 2026-08-11 wedge, which appeared minutes after the two MIDI
      cases and went unnoticed for about fourteen minutes. MIDI load is the
      first suspect only because of when it appeared; the root cause is still
      unknown.

      Worth running even when it passes. With the URB liveness watchdog in place
      a wedge is now reported within 1.5 s with a measured onset age, so this
      case either produces that timestamp or, over a long enough clean run, says
      the wedge is not reachable through MIDI load. The escalation work is gated
      on one of those two answers.

      Paced just UNDER the driver's ~3125 B/s ceiling on purpose. Overdriving it
      backs up the rawmidi buffer and produces the "rawmidi drain error" that
      lib/rules.yaml treats as a failure -- correctly, since on a healthy device
      it means the URB ring has died. Provoking it deliberately would make the
      case fail on its own doing and bury the one signature worth watching for.

      Formerly JT-SOAK-004. The SOAK area predated the L1..L5 test-level
      scheme, whose L5 (endurance/stability) already covers what SOAK was
      standing in for; each former SOAK case moved into the area it actually
      belongs to and kept its level: L5.

  # --------------------------------------------------------------------- PM

  - id: JT-PM-001
    title: Suspend and resume while idle
    area: PM
    level: L3
    mode: automated
    status: implemented
    requires: [device, root, rtc-wake]
    exec: cases/pm_suspend.py
    params:
      sleep_seconds: 10
    metrics: [suspend_ms, resume_ms]
    pass: >
      The system suspends and resumes, and the device is usable afterwards
      without reloading the driver.
    notes: >
      From suspend_resume_test_plan.md.

      This case reliably surfaces four unclassified lines, and they are
      expected to keep appearing until somebody resolves them:

        ep_05: PM: parent 1-13:1.0 should not be sleeping

      One per endpoint, naming this device's own interfaces. A dev_warn from
      the PM core meaning a child was resumed while its parent was still
      suspended. Seen on a production kernel in two separate runs. It is
      deliberately not classified either way -- see the note above the
      `unrelated` list in lib/rules.yaml, and docs/test_strategy.md section 12.

      So a review flag on this case is not necessarily a new problem. Check
      whether the unclassified lines are these four before treating it as one.

  - id: JT-PM-002
    title: Suspend during playback
    area: PM
    level: L3
    mode: manual
    status: implemented
    requires: [device, root, rtc-wake, human]
    metrics: [recovery_ms]
    pass: >
      Playback stops with an error and can be restarted after re-preparing the
      stream. An application dying here is the correct outcome, not a failure.
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Start playback and leave it running:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 44100 /dev/urandom
      - >
        Suspend for 15 seconds:
        sudo /usr/local/sbin/jockey3-testctl rtcwake-mem 15
      - >
        Confirm the machine resumes, and that aplay exited with an error rather
        than hanging or continuing silently.
      - Confirm the card is still present in /proc/asound/cards.
      - Start playback again and confirm audio is restored without reloading
        the driver.
      - Check dmesg for an oops, a hung task, or a stuck reference count.
    notes: >
      SNDRV_PCM_INFO_RESUME is deliberately not advertised because the device
      loses stream sync, so aplay dying here is the CORRECT outcome. The
      failure would be a hang, a crash, or a stream that cannot be restarted.

      This is the case most likely to leave the machine wedged, so run it when
      the serial console is being captured.

  # ---------------------------------------------------------------- HOTPLUG

  - id: JT-HOTPLUG-001
    title: Disconnect during playback
    area: HOTPLUG
    level: L3
    mode: manual
    status: implemented
    requires: [device, human]
    pass: >
      Playback terminates with an error, the card disappears, and the module
      can still be unloaded cleanly afterwards.
    steps:
      - Start playback.
      - Unplug the USB cable.
      - Confirm the application exits with an error rather than hanging.
      - Confirm the card is gone and the module unloads.
    notes: >
      All eight in-flight URBs error at once here, so this is the routine way
      into the error give-up path rather than an exotic one.

      DELIBERATELY NOT AUTOMATED WITH uhubctl, even though the ppps hub makes
      it easy and JT-PROBE-003 does exactly that. Measured 2026-08-10, idle
      and under active playback: a port power-off produces no -71 (EPROTO)
      burst at all. The device vanishes at once, resubmits fail synchronously
      with -19, and "stopped after N consecutive URB errors; deferring
      recovery" is never reached -- which is the one thing this case exists
      to exercise. Automating it that way would turn a green run into
      evidence for something it never tested.

      The -71 accumulation needs a disconnect that DEGRADES: a hand on the
      cable, or the mains relay of JT-HOTPLUG-003 (automated since
      2026-08-19, now the repeatable route to that path).

  - id: JT-HOTPLUG-002
    title: Replug and reuse
    area: HOTPLUG
    level: L3
    mode: manual
    status: implemented
    requires: [device, human]
    pass: The device re-enumerates and is immediately usable.
    steps:
      - Starting from the state JT-HOTPLUG-001 left behind, plug the cable back in.
      - Confirm the card reappears in /proc/asound/cards, with a playback and
        a capture substream and one rawmidi device.
      - Play a channel sweep and confirm audio works without reloading the driver.
      - Run actions/blink_leds.sh and confirm MIDI OUT still reaches the device.
      - >
        Confirm the card index was reused rather than incremented without
        bound -- a slot leak shows up here first.

  - id: JT-HOTPLUG-003
    title: Power cycle during playback
    area: HOTPLUG
    level: L3
    mode: automated
    status: implemented
    requires: [device, root]
    exec: cases/hotplug_power_cycle.py
    params:
      iterations_per_run: 1
      off_seconds: 5
      settle_seconds: 8
      warmup_seconds: 1
      rate: 44100
      operator_timeout_seconds: 120
    metrics: [power_control, cycles, aplay_error_ms, card_gone_ms, gave_up,
              reenumerate_ms, resubstream_ms, unload_ok, reload_ok]
    pass: >
      Playback errors out rather than hanging when the device's own mains
      power is cut with USB left connected; the card disappears and
      re-enumerates once power returns; and the module still unloads and
      reloads cleanly afterwards.
    expect_dmesg:
      - '(?:Playback|Capture|MIDI IN) URB error: -71 \(\d+ consecutive\)'
      - 'MIDI IN stopped after \d+ consecutive URB errors$'
      - 'jockey3_urb_error_give_up: \d+ callbacks suppressed'
    steps:
      - 'Resolve the card: CARD=$(awk ''/RJ3/{print $1}'' /proc/asound/cards)'
      - >
        Start playback:
        aplay -D hw:$CARD,0 -f S24_3LE -c 4 -r 44100 /dev/urandom
      - >
        Cut power to the device at the mains without unplugging USB, wait five
        seconds, and restore it.
      - Confirm the application exited with an error rather than hanging.
      - >
        Check dmesg for the give-up message ("stopped after N consecutive
        URB errors; deferring recovery"). Reaching it here is expected and is
        not a failure -- this is one of the few ways to reach that path at
        all.
      - Confirm the device re-enumerates, and that the module still unloads
        cleanly afterwards.
    notes: >
      Distinct from JT-HOTPLUG-001 because USB stays connected while the
      device stops responding, which is a different failure to a clean
      disconnect: the URBs error without a disconnect() to tidy up after them.

      Automated since 2026-08-19 via the mains relay (cases/hotplug_power_cycle.py),
      which is also the only way to reach the give-up path repeatably -- the
      ppps hub added in 2026-08 does not reach it: a port power-off is a
      clean, instant VBUS drop and the errors arrive as -19 instead, not -71.
      Falls back to an operator at the switch when no relay is configured
      (same DevicePower/OperatorPower split as JT-AUDIO-005), with `human`
      deliberately absent from `requires` for the same reason as there: the
      operator step only instructs, it never blocks on an answer, so the case
      still runs unattended when a relay is present.

      Measured on hardware (2026-08-19, pi4test, idle): cutting the relay
      produces the -71 burst and every direction's give-up line within about
      10 ms, regardless of whether a PCM substream is open -- URBs run free
      for the device's lifetime. What only an OPEN playback stream can show,
      and the reason this case still starts a real aplay process, is the
      userspace-visible half: whether the open substream's writes come back
      with an error so the application exits, or block forever.

      The steps used to quote a DIFFERENT give-up message, "hardware may
      need power-cycling" -- that string is real (jockey3.c,
      jockey3_recover_urb_stream()) but belongs to a recovery escalation
      reachable only after a URB restart AND a full USB reset both fail to
      bring a direction back. A playback-only power cycle cannot
      reach it, and forcing a capture open afterward just to chase a message
      that only fires when recovery has already failed twice was rejected as
      testing a should-not-happen path on every run instead of the one this
      case is actually for. expect_dmesg above matches the message this
      scenario does reach.

  - id: JT-HOTPLUG-004
    title: USB reset recovery
    area: HOTPLUG
    level: L3
    mode: manual
    status: idea
    requires: [device, root, human]
    metrics: [reset_ms, resets_attempted, resets_failed]
    pass: The device recovers after a queued reset and audio resumes.
    steps:
      - >
        Note that JT-RATE-001 already triggers this path routinely -- check
        dmesg there for "Rate change to N Hz left a stream stalled" before
        doing anything by hand.
      - >
        To force one: start playback, then trigger a rate change to a lower
        rate while capture is open (see JT-RATE-002), which is the case most
        likely to stall.
      - >
        Confirm dmesg shows the reset being queued and completing, with a
        "waited N ms for reset completion" line.
      - Confirm audio resumes afterwards without reloading the driver.
      - >
        Confirm no hung task and no lockdep report -- the deadlock this path
        guards against would appear as a blocked task, not as an error return.
    notes: >
      RETIRED 2026-08-20 (status idea, same precedent as JT-PROBE-004; out of
      --list and the ledger, same mechanism). A manual case that waits for an
      event neither predictable nor under the tester's control is not a valid
      test -- it either passes vacuously (the event never happened, nobody
      noticed) or wastes a session babysitting a probability. And the
      probability kept dropping: resets_per_change_pct from JT-RATE-001 is
      0% on x86_64-prod across its last six runs (Milestone 13 eliminated the
      path there) and 1.7% and falling on arm64-prod -- not something a human
      can wait for and call a result.

      Two things this case cared about are already covered elsewhere, not by
      a dedicated instrument but as a side effect of ones that already exist:

      1. Whether the reset itself works (queued rather than reached from ioctl
         context, audio resumes afterwards) -- JT-RATE-001/JT-RATE-002 already
         provoke this path directly (the "shape that provokes the fault" is
         deliberate in JT-RATE-001's sweep_order) and already record it:
         resets_total_device, recovery_triggered_capture, recovery_triggered_playback,
         reset_wait_ms. Whenever a reset actually fires during a routine run,
         it is measured, not merely hoped for.
      2. Whether it deadlocks -- lib/rules.yaml's `investigate` bucket matches
         "INFO: task .* blocked for more than", lockdep's circular/recursive
         locking warnings, and Call Trace: unconditionally, on every case's
         kernel-log slice, not only a dedicated hotplug run. The specific
         deadlock this case worried about (usb_reset_device() from ioctl
         context) would surface there regardless of which case happened to be
         running when it did.

      Deliberately NOT rebuilt as a driver-forced fault injection. Adding a
      hook, an #ifdef or a sysfs attribute so the driver can be told to stall
      on demand is against this project's own constraints on the test tooling
      (see docs/codec_testing.md and CLAUDE.md: no test hooks in the driver) --
      and it would also change what passing means, from "this recovers on
      real hardware" to "this code path runs when asked to", which is a
      weaker, L2-shaped claim wearing an L3 case's clothes.

      A non-invasive alternative exists but covers less than this case did:
      /sys/bus/usb/devices/<dev>/reset is usbcore's own facility, triggers a
      real external reset with no driver changes, and would deterministically
      exercise .pre_reset/.post_reset (a failed reset unbinding rather than
      resuming). It would NOT exercise jockey3_recover_urb_stream()'s own
      usb_queue_reset_device() + jockey3_wait_for_reset_completion() machinery,
      since that only runs from an internally-detected stall, which an
      external sysfs reset bypasses entirely. Worth its own case if that
      narrower guarantee is ever wanted; not a replacement for this one.

